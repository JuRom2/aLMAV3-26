// Cola de reintento: si el envio al servidor falla (por congestion,
// desconexion momentanea, etc.), el evento NO se pierde. Queda guardado
// aqui y se reintenta solo en el siguiente ciclo, hasta que se confirme
// que el servidor lo recibio.
const OUTBOX_KEY = 'sync_outbox_DIC_v1';
function loadOutbox(){
  try{ return JSON.parse(localStorage.getItem(OUTBOX_KEY)||'[]'); }catch(e){ return []; }
}
function saveOutboxArr(arr){ safeLocalSet(OUTBOX_KEY, JSON.stringify(arr)); }
let FLUSHING_OUTBOX = false;
let OUTBOX_LAST_ERROR = null;
// Intenta cada evento pendiente POR SEPARADO. Antes, si el primero de la
// cola fallaba, se dejaba de intentar con TODOS los que venian detras
// (aunque esos si hubieran podido enviarse bien) — un solo evento
// problematico bloqueaba a los demas indefinidamente. Ahora cada uno se
// intenta de forma independiente en cada ciclo, y solo los que sigan
// fallando quedan en la cola para el siguiente intento.
async function flushOutbox(){
  if(!SYNC_URL || FLUSHING_OUTBOX) return;
  FLUSHING_OUTBOX = true;
  try{
    const outbox = loadOutbox();
    const pendientes = [];
    let huboExito = false;
    for(const evento of outbox){
      try{
        const res = await fetch(SYNC_URL, {
          method:'POST',
          headers:{'Content-Type':'text/plain;charset=utf-8'},
          body: JSON.stringify(evento)
        });
        if(!res.ok) throw new Error('status '+res.status);
        // OJO: Apps Script responde HTTP 200 incluso cuando el guardado
        // logico fallo (por ejemplo, candado ocupado -> {ok:false,...}).
        // Hay que revisar el contenido, no solo el codigo HTTP, para no
        // dar por entregado un evento que en realidad no se guardo.
        const body = await res.json();
        if(!body || body.ok !== true) throw new Error('respuesta no exitosa: '+(body && body.error));
        huboExito = true;
      }catch(e){
        console.error('sync push error, se reintentara luego', e);
        OUTBOX_LAST_ERROR = { msg: String(e.message||e), hora: new Date() };
        pendientes.push(evento); // este si se queda para el siguiente intento
      }
    }
    saveOutboxArr(pendientes);
    if(pendientes.length===0) OUTBOX_LAST_ERROR = null;
    if((huboExito || pendientes.length===0) && TAB==='sync') renderSync();
  } finally {
    FLUSHING_OUTBOX = false;
  }
}
async function pushEvento(tipo, payload){
  if(!SYNC_URL) return;
  const id = Date.now()+'_'+Math.random().toString(36).slice(2);
  LAST_EVENT_IDS.add(id);
  saveLastEventIds();
  const outbox = loadOutbox();
  outbox.push({id, tipo, payload});
  saveOutboxArr(outbox);
  flushOutbox();
}
function aplicarEventoRemoto(tipo, p, DIRTY){
  // Los eventos pueden llegar/reproducirse fuera de orden (por ejemplo al
  // usar "Resincronizar todo"). Cada confirmacion/deshacer trae su propia
  // marca de hora (ts); solo se aplica si es igual o mas nueva que lo que
  // ya hay guardado, para que un evento antiguo nunca pise uno reciente.
  if(tipo==='salida_ok'){
    if(!SAL_STATE[p.fecha]) SAL_STATE[p.fecha] = {items:{}};
    const key = salK(p.s,p.p,p.nb,p.cantidad,p.oc,p.idx);
    const actual = SAL_STATE[p.fecha].items[key];
    if(!actual || (actual.ts||0) <= (p.ts||0)){
      SAL_STATE[p.fecha].items[key] = {rec:p.cantidad, hora:p.hora, ts:p.ts};
      DIRTY.salida = true;
      logActividad('Salida confirmada: '+p.nb+' ('+p.p+') — '+p.cantidad);
    }
  } else if(tipo==='salida_undo'){
    const key = salK(p.s,p.p,p.nb,p.cantidad,p.oc,p.idx);
    const actual = SAL_STATE[p.fecha]?.items?.[key];
    if(!actual || (actual.ts||0) <= (p.ts||0)){
      if(SAL_STATE[p.fecha]?.items){
        delete SAL_STATE[p.fecha].items[key];
        delete SAL_STATE[p.fecha].items[salK(p.s,p.p,p.nb,p.cantidad,undefined,p.idx)];
        delete SAL_STATE[p.fecha].items[salK(p.s,p.p,p.nb,undefined,undefined,p.idx)];
      }
      DIRTY.salida = true;
      logActividad('Salida deshecha: '+p.nb);
    }
  } else if(tipo==='ingreso_set'){
    if(!ING_STATE[p.fecha]) ING_STATE[p.fecha] = {items:{}};
    const actual = ING_STATE[p.fecha].items[p.entregaId];
    if(!actual || (actual.ts||0) <= (p.entry.ts||0)){
      ING_STATE[p.fecha].items[p.entregaId] = p.entry;
      DIRTY.ingreso = true;
      const infoIt = (INGRESO_DATA[p.fecha]||[]).find(x=>x.id===p.entregaId);
      const nom = infoIt?infoIt.nombre:p.entregaId;
      logActividad(p.entry.state==='ok' ? ('Ingreso confirmado: '+nom+' — '+p.entry.rec+(p.entry.fechaReposicion?' (reposicion de faltante)':'')) : ('Ingreso pendiente/faltante: '+nom));
    }
  } else if(tipo==='ingreso_undo'){
    const actual = ING_STATE[p.fecha]?.items?.[p.entregaId];
    if(!actual || (actual.ts||0) <= (p.ts||0)){
      if(ING_STATE[p.fecha]?.items) delete ING_STATE[p.fecha].items[p.entregaId];
      DIRTY.ingreso = true;
      const infoIt = (INGRESO_DATA[p.fecha]||[]).find(x=>x.id===p.entregaId);
      logActividad('Ingreso deshecho: '+(infoIt?infoIt.nombre:p.entregaId));
    }
  } else if(tipo==='movimiento'){
    const arr = KARDEX[p.codigo] || (KARDEX[p.codigo] = []);
    if(!arr.some(m=>m._syncId===p.mov._syncId)){
      arr.unshift(p.mov);
      const it = CATALOG.find(i=>i.id===p.codigo);
      logActividad((p.mov.tipo==='devolucion'?'Devolucion registrada: ':'Pedido adicional: ')+(it?it.nombre:p.codigo)+' — '+p.mov.cantidad);
    }
    DIRTY.kardex = true;
  } else if(tipo==='movimiento_borrado'){
    const arr = KARDEX[p.codigo] || [];
    const idx = arr.findIndex(m=>m._syncId===p.syncId);
    if(idx!==-1){
      const mov = arr[idx];
      arr.splice(idx,1);
      const it = CATALOG.find(i=>i.id===p.codigo);
      logActividad('Movimiento eliminado: '+(mov.tipo==='devolucion'?'Devolucion':'Pedido adicional')+' de '+(it?it.nombre:p.codigo)+' — '+mov.cantidad);
    }
    DIRTY.kardex = true;
  } else if(tipo==='salida_borrar_clave'){
    if(SAL_STATE[p.fecha]?.items && Object.prototype.hasOwnProperty.call(SAL_STATE[p.fecha].items, p.key)){
      delete SAL_STATE[p.fecha].items[p.key];
      DIRTY.salida = true;
      logActividad('Salida huerfana eliminada: '+(p.key.split('||')[2]||p.key)+' ('+p.fecha+')');
    }
  } else if(tipo==='distrib_set'){
    const actual = DISTRIB_STATE[p.key];
    // El registro de una entrega se reemplaza entero cada vez (lista completa
    // de asignaciones); se compara por ts para que un evento viejo repetido
    // no pise una version mas nueva.
    if(!DISTRIB_STATE._ts) DISTRIB_STATE._ts = {};
    if(!DISTRIB_STATE._ts[p.key] || DISTRIB_STATE._ts[p.key] <= (p.ts||0)){
      DISTRIB_STATE[p.key] = p.valor;
      DISTRIB_STATE._ts[p.key] = p.ts||0;
      DIRTY.distrib = true;
    }
  }
}
async function pullEventos(manual, esReintento){
  if(!SYNC_URL || (SYNC_BUSY && !esReintento)) return;
  SYNC_BUSY = true;
  try{
    // Se pide solo lo NUEVO desde el cursor guardado (cuantos eventos ya
    // se vieron), no la hoja completa cada vez -- mucho mas rapido cuando
    // ya hay miles de filas de historial.
    const res = await fetch(SYNC_URL+'?t='+Date.now()+'&desde='+SYNC_CURSOR);
    const data = await res.json();
    if(data.ok){
      let nuevos = 0;
      const DIRTY = {salida:false, ingreso:false, kardex:false, distrib:false};
      data.eventos.forEach(evt=>{
        if(LAST_EVENT_IDS.has(evt.id)) return;
        // OJO: solo se marca como "ya visto" DESPUES de aplicarlo con
        // exito. Antes se marcaba primero y se aplicaba despues -- si
        // aplicarEventoRemoto fallaba (por cualquier motivo, incluso
        // pasajero), el evento quedaba descartado para siempre, sin
        // volver a intentarlo nunca mas (ni con "Resincronizar todo").
        try{
          aplicarEventoRemoto(evt.tipo, JSON.parse(evt.payload), DIRTY);
          LAST_EVENT_IDS.add(evt.id);
          nuevos++;
        }catch(e){ console.error('Error aplicando evento, se reintentara en el siguiente ciclo', evt.id, evt.tipo, e); try{ logActividad('No se pudo aplicar un evento de sincronizacion ('+evt.tipo+'), se reintentara: '+e.message); }catch(e2){} }
      });
      if(DIRTY.salida) saveSalidaLS();
      if(DIRTY.ingreso) saveIngresoLS();
      if(DIRTY.kardex) saveKardexLS();
      if(DIRTY.distrib) saveDistribLS();
      if(nuevos>0) saveLastEventIds();
      // El cursor avanza con el total que reporta el servidor. Si el
      // total bajara (por ejemplo, tras limpiar duplicados en la hoja),
      // se detecta y se reinicia el cursor a 0 para no perder eventos.
      if(typeof data.total === 'number'){
        if(data.total < SYNC_CURSOR){ SYNC_CURSOR = 0; }
        else if(data.total > SYNC_CURSOR){ SYNC_CURSOR = data.total; }
        saveSyncCursor();
      }
      LAST_SYNC_TIME = new Date();
      if(nuevos>0) render(); else if(TAB==='sync') renderSync();
      if(manual) toast(nuevos>0 ? ('Sincronizado: '+nuevos+' evento(s) nuevo(s)') : 'Ya estaba al dia');
    }
  }catch(e){
    console.error('sync pull error', e);
    if(!esReintento){
      // Google Apps Script a veces falla una sola vez de forma pasajera
      // y responde bien enseguida despues -- se reintenta una vez tras
      // una breve pausa antes de darlo por fallido de verdad.
      SYNC_BUSY = false;
      setTimeout(()=>pullEventos(manual, true), 2500);
      return;
    }
    if(manual) toast('Error de sincronizacion');
  }
  SYNC_BUSY = false;
}

    <div id="dupBox" style="margin-top:10px"></div>
    <div class="ing-meta" style="margin:14px 0 10px;border-top:1px solid var(--bd);padding-top:14px">Revisa salidas guardadas que ya no corresponden a ningun producto actual del cronograma (residuo de una correccion de la app del 09/09/2026 sobre productos repetidos en una misma preparacion).</div>
    <div class="dlg-actions">
      <button onclick="renderDiagnosticoSalidasHuerfanas()">&#128269; Revisar salidas huerfanas</button>
    </div>
    <div id="dupSalBox" style="margin-top:10px"></div>
  </div>`;
  h += `<div class="sync-card" style="margin-top:14px">
    <div style="font-weight:700;margin-bottom:6px">Reporte mensual (Ingreso, Salida e Inventario)</div>
    <div class="ing-meta" style="margin-bottom:10px">Genera un Excel con 3 hojas, cada una agrupada por Orden de Compra: cuanto ingreso de cada producto ese mes, cuanto salio, y el stock que queda al cierre del mes (solo lo que tiene saldo).</div>
    <input type="month" id="reporteMesInput" value="${new Date().toISOString().slice(0,7)}" style="max-width:200px">
    <div class="dlg-actions">
      <button class="fc fa" onclick="generarReporteMensualXLSX(document.getElementById('reporteMesInput').value)">&#8659; Generar reporte del mes</button>
    </div>
  </div>`;
  h += `<div class="sync-card" style="margin-top:14px">
    <div class="ing-meta" style="margin:0 0 10px;color:#b91c1c"><b>Zona de riesgo:</b> esto borra de este dispositivo todo lo trabajado en Ingreso, Salida, Distribucion, Kardex y el registro de actividad, y desconecta la sincronizacion (para que no se vuelva a traer ese historial del servidor). No afecta el catalogo ni el cronograma, y no borra nada en el servidor de sincronizacion ni en otros dispositivos.</div>
    <div class="dlg-actions">
      <button style="background:#b91c1c;color:#fff;border-color:#b91c1c" onclick="borrarTodoLocal()">&#128465; Borrar todos los datos locales de este dispositivo</button>
    </div>
  </div>`;
  document.getElementById('mainArea').innerHTML = h;
  const kb = (espacioUsadoLS()/1024).toFixed(0);
  const mb = (espacioUsadoLS()/1024/1024).toFixed(2);
  const box = document.getElementById('espacioBox');
  if(box) box.innerHTML = `${mb} MB <span style="font-size:13px;font-weight:400;color:var(--mut)">(${kb} KB) usados en este dispositivo</span>`;
}
function diagnosticoDuplicadosIngreso(){
  const out = [];
  Object.entries(ING_STATE).forEach(([fecha, day])=>{
    const porCodigo = {};
    Object.entries(day.items||{}).forEach(([key, e])=>{
      if(e.state!=='ok' || e.rec==null) return;
      const codigo = e.codigo || key.split('||')[0].split('_')[0];
      (porCodigo[codigo] || (porCodigo[codigo]=[])).push({entregaId:key, rec:e.rec, hora:e.horaOK||''});
    });
    Object.entries(porCodigo).forEach(([codigo, entries])=>{
      if(entries.length>1){
        const cat = CATALOG.find(c=>c.id===codigo);
        const enCronograma = new Set((INGRESO_DATA[fecha]||[]).map(x=>x.id));
        out.push({
          fecha, codigo, nombre: cat?cat.nombre:codigo,
          entries: entries.map(en=>({...en, huerfano: !enCronograma.has(en.entregaId)}))
        });
      }
    });
  });
  return out.sort((a,b)=> a.fecha.localeCompare(b.fecha));
}
function renderDiagnosticoDuplicados(){
  const box = document.getElementById('dupBox');
  const casos = diagnosticoDuplicadosIngreso();
  if(!casos.length){ box.innerHTML = '<div class="ing-meta" style="color:var(--ok)">No se encontraron ingresos duplicados. Todo en orden.</div>'; return; }
  let h = `<div class="ing-meta" style="margin-bottom:8px"><b>${casos.length} caso(s) encontrado(s).</b> Deja UNA de las lineas de cada caso y deshaz las demas.</div>`;
  casos.forEach(c=>{
    h += `<div class="ing-row" style="display:block">
      <div class="ing-name">${ev(c.nombre)} &middot; ${c.fecha}</div>`;
    c.entries.forEach(en=>{
      h += `<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-top:1px solid var(--bd)">
        <div class="ing-meta">Cantidad: ${en.rec} ${en.hora?(' &middot; Hora: '+ev(en.hora)):''} ${en.huerfano?' &middot; <b style="color:var(--dg)">huerfano (ya no esta en el cronograma actual)</b>':''}</div>
        <button class="fc" onclick="deshacerDesdeDiagnostico('${ev(c.fecha)}','${ev(en.entregaId)}')">Deshacer esta</button>
      </div>`;
    });
    h += `</div>`;
  });
  box.innerHTML = h;
}
function deshacerDesdeDiagnostico(fecha, entregaId){
  if(!confirm('¿Deshacer esta confirmacion de ingreso del '+fecha+'? Esta accion no se puede deshacer.')) return;
  ingDeshacer(fecha, entregaId);
  renderDiagnosticoDuplicados();
}
// Diagnostico de salidas "huerfanas": claves guardadas en SAL_STATE que ya
// no corresponden a NINGUNA fila valida del cronograma actual. Esto puede
// quedar como residuo de la correccion del 09/09/2026 sobre productos
// repetidos dentro de una misma preparacion (durante un rato, el indice se
// calculaba mal y casi cualquier producto podia terminar confirmado dos
// veces bajo una clave vieja y una nueva).
function diagnosticoSalidasHuerfanas(){
  const out = [];
  Object.keys(SAL_STATE).sort().forEach(fecha=>{
    const items = SAL_STATE[fecha]?.items || {};
    if(!Object.keys(items).length) return;
    const validas = new Set();
    salApsFor(fecha).forEach(({s,p,pr,idx})=>{
      validas.add(salK(s,p,pr.n,pr.c,pr.oc,idx));
      validas.add(salK(s,p,pr.n,pr.c,undefined,idx));
      validas.add(salK(s,p,pr.n,undefined,undefined,idx));
    });
    Object.entries(items).forEach(([key, entry])=>{
      if(entry.rec==null || validas.has(key)) return;
      const parts = key.split('||');
      out.push({fecha, key, servicio:parts[0]||'', prep:parts[1]||'', nombre:parts[2]||key, cantidad:entry.rec, hora:entry.hora||''});
    });
  });
  return out;
}
function renderDiagnosticoSalidasHuerfanas(){
  const box = document.getElementById('dupSalBox');
  const casos = diagnosticoSalidasHuerfanas();
  if(!casos.length){ box.innerHTML = '<div class="ing-meta" style="color:var(--ok)">No se encontraron salidas huerfanas. Todo en orden.</div>'; return; }
  let h = `<div class="ing-meta" style="margin-bottom:8px"><b>${casos.length} caso(s) encontrado(s).</b> Cada uno es una salida guardada que ya no corresponde a ningun producto del cronograma actual. Antes de eliminar, compara con el Kardex del producto para confirmar que sobra.</div>`;
  casos.forEach(c=>{
    h += `<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-top:1px solid var(--bd)">
      <div class="ing-info">
        <div class="ing-name">${ev(c.nombre)}</div>
        <div class="ing-meta">${c.fecha} &middot; ${ev(c.servicio)} &middot; ${ev(c.prep)} &middot; Cantidad: ${c.cantidad}${c.hora?(' &middot; Hora: '+ev(c.hora)):''}</div>
      </div>
      <button class="fc" onclick="borrarSalidaHuerfana('${ev(c.fecha)}','${ev(c.key)}')">Eliminar esta</button>
    </div>`;
  });
  box.innerHTML = h;
}
function borrarSalidaHuerfana(fecha, key){
  if(!confirm('¿Eliminar esta salida huerfana del '+fecha+'? Esta accion no se puede deshacer y va a bajar el conteo de salida (y subir el saldo) de ese producto.')) return;
  if(SAL_STATE[fecha]?.items) delete SAL_STATE[fecha].items[key];
  saveSalidaLS();
  pushEvento('salida_borrar_clave', {fecha, key, ts: Date.now()});
  logActividad('Salida huerfana eliminada: '+key.split('||')[2]+' ('+fecha+')');
  renderDiagnosticoSalidasHuerfanas();
  render();
  toast('Salida huerfana eliminada');
}
function borrarTodoLocal(){
  if(!confirm('Esto borra TODO lo trabajado en este dispositivo: Ingreso, Salida, Distribucion, Kardex y el registro de actividad. No se puede deshacer. ¿Continuar?')) return;
  if(!confirm('Esto tambien va a DESCONECTAR la sincronizacion de este dispositivo (para que no vuelva a traerse el historial viejo del servidor en cuanto recargue). Vas a tener que configurar de nuevo la URL de sincronizacion despues, si quieres usar una. ¿Continuar?')) return;
  [LS_INGRESO, LS_SALIDA, LS_KARDEX, LS_DISTRIB, LS_ACTLOG, LS_RECENT, 'lastEventIds_DIC', CONF_KEY].forEach(k=>localStorage.removeItem(k));
  location.reload();
}
async function probarConexion(){
  const box = document.getElementById('diagBox');
  const url = document.getElementById('syncUrlInput')?.value.trim() || SYNC_URL;
  if(!url){ box.innerHTML = '<div class="ing-meta" style="color:var(--dg)">Pega la URL primero.</div>'; return; }
  box.innerHTML = '<div class="ing-meta">Probando...</div>';
  if(!url.includes('/exec')){
    box.innerHTML = `<div class="ing-meta" style="color:var(--dg)"><b>La URL no termina en /exec</b> — parece que pegaste la URL del editor de Apps Script en vez de la URL de la aplicacion web publicada. Ve a Implementar > Gestionar implementaciones para copiar la URL correcta.</div>`;
    return;
  }
  try{
    const res = await fetch(url+'?t='+Date.now());
    const status = res.status;
    const text = await res.text();
    let parsed = null;
    try{ parsed = JSON.parse(text); }catch(e){}
    if(parsed && parsed.ok){
      box.innerHTML = `<div class="ing-meta" style="color:var(--ok)"><b>Conexion exitosa.</b> El script respondio correctamente con ${parsed.eventos.length} evento(s) guardado(s) hasta ahora.</div>`;
    } else if(text.includes('Google Apps Script') && text.includes('sign in')){
      box.innerHTML = `<div class="ing-meta" style="color:var(--dg)"><b>El script pide iniciar sesion.</b> En la implementacion, el permiso "Quien tiene acceso" no esta puesto en "Cualquier usuario". Vuelve a Implementar > Gestionar implementaciones > editar (icono lapiz) > cambia el acceso y vuelve a implementar.</div>`;
    } else if(text.trim().startsWith('<')){
      box.innerHTML = `<div class="ing-meta" style="color:var(--dg)"><b>El script devolvio una pagina HTML en vez de datos</b> (status ${status}). Esto suele pasar si la implementacion no autorizo permisos, o si el codigo tiene un error. Revisa en Apps Script > Ejecuciones, para ver el detalle del error.</div>`;
    } else {
      box.innerHTML = `<div class="ing-meta" style="color:var(--dg)">Respuesta inesperada (status ${status}): ${ev(text.slice(0,200))}</div>`;
    }
  }catch(e){
    box.innerHTML = `<div class="ing-meta" style="color:var(--dg)"><b>No se pudo conectar.</b> Error: ${ev(e.message)}. Revisa que la URL este bien copiada y que tengas internet.</div>`;
  }
}
// Un poco de variacion aleatoria (jitter) para que, con varios dispositivos
// sincronizando a la vez, no todos disparen su consulta en el mismo segundo
// exacto — eso evita picos de peticiones simultaneas contra el mismo script.
setInterval(()=>{ pullEventos(false); flushOutbox(); }, 35000 + Math.floor(Math.random()*10000));

async function init(){
  loadRecent();
  loadIngresoLS();
  loadDistribLS();
  loadKardexLS();
  loadSalidaLS();
  loadActivityLog();
  if(INGRESO_B64){ try{ INGRESO_DATA = await decompressB64(INGRESO_B64); }catch(e){ console.error('No se pudo cargar cronograma de ingreso', e); } } else { INGRESO_DATA = {}; }
  if(SAL_DOSIF_B64){ try{ SAL_DOSIF = await decompressB64(SAL_DOSIF_B64); }catch(e){ console.error('No se pudo cargar dosificacion de salida', e); } } else { SAL_DOSIF = {}; }
  migrarIngresoAClaveCompuesta();
  migrarFechasIngresoDesincronizadas();
  migrarDistribLedgerSiNecesario();
  render();
  if(SYNC_URL){ pullEventos(false); flushOutbox(); }
}
init();
