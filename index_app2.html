    var _moduleCount = 0;

        for (var c = -1; c <= 7; c += 1) {

          }

            for (var c = -2; c <= 2; c += 1) {

              } else {

        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;

      var maxEcCount = 0;

      var ecdata = new Array(rsBlocks.length);

            data[index] = ecdata[r][i];
            index += 1;

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );

        totalDataCount += rsBlocks[i].dataCount;

          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

      case 'Alphanumeric' :

        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;

      _dataList.push(newData);

      }
      return _modules[row][col];

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {

          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );

.toast{position:fixed;bottom:20px;right:22px;background:var(--ink);color:#fff;border-radius:8px;padding:10px 16px;font-size:12px;z-index:999;transform:translateY(14px);opacity:0;transition:all .25s cubic-bezier(.34,1.56,.64,1);max-width:360px;pointer-events:none;border-left:3px solid var(--ok)}
.toast.show{transform:translateY(0);opacity:1}
.scanwrap{max-width:480px;margin:0 auto}
.scanbox{position:relative;background:#000;border-radius:14px;overflow:hidden;aspect-ratio:1;display:flex;align-items:center;justify-content:center}
.scanbox video{width:100%;height:100%;object-fit:cover}
.scanbox .frame{position:absolute;inset:14%;border:3px solid rgba(255,255,255,.75);border-radius:14px;pointer-events:none;box-shadow:0 0 0 999px rgba(0,0,0,.28)}
.scanbox .frame.hit{border-color:var(--ok)}
.scan-msg{text-align:center;color:var(--mut);font-size:12px;margin-top:10px}
.scan-actions{display:flex;gap:8px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.manual-entry{margin-top:22px;padding-top:18px;border-top:1px solid var(--bd)}
.manual-entry label{font-family:var(--mn);font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:.1em}
.manual-entry .mrow{display:flex;gap:8px;margin-top:8px}
.manual-entry input{flex:1;background:var(--sf);border:1px solid var(--bd);border-radius:6px;padding:9px 12px;font-size:13px;outline:none}
.manual-entry input:focus{border-color:var(--acc)}
.recent-list{margin-top:20px}
.recent-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--bd);border-radius:8px;margin-bottom:6px;cursor:pointer;background:var(--sf)}
.recent-item:hover{border-color:var(--acc)}
.recent-item .ri-id{font-family:var(--mn);font-size:10px;color:var(--mut);background:var(--s2);padding:2px 7px;border-radius:99px}
.ing-datebar{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.ing-datebar input[type=date]{background:var(--sf);border:1px solid var(--bd);border-radius:6px;padding:8px 12px;font-size:13px;font-family:var(--mn)}
.ing-arrow{background:var(--sf);border:1px solid var(--bd);border-radius:6px;width:34px;height:34px;cursor:pointer;font-size:14px}
.ing-arrow:hover{border-color:var(--ink)}
.ing-row{display:flex;align-items:center;gap:10px;padding:11px 14px;border:1px solid var(--bd);border-radius:8px;margin-bottom:8px;background:var(--sf)}
.ing-row.rok{border-color:var(--ok);background:var(--okl)}
.ing-row.rsh{border-color:var(--dg);background:var(--dgl)}
.ing-info{flex:1;min-width:0}
.ing-name{font-weight:600;font-size:13px}
.ing-meta{font-family:var(--mn);font-size:13px;color:var(--mut);margin-top:2px}
.ing-qty{display:flex;align-items:center;gap:6px}
.ing-qty input{width:90px;background:#fff;border:1px solid var(--bd);border-radius:6px;padding:7px 9px;font-size:13px;text-align:right}
.ing-badge{font-family:var(--mn);font-size:10px;font-weight:700;padding:4px 10px;border-radius:99px;white-space:nowrap}
.ing-badge.pend{background:var(--s2);color:var(--mut)}
.ing-badge.ok{background:var(--ok);color:#fff}
.ing-badge.sh{background:var(--dg);color:#fff}
.dlg-actions{display:flex;gap:8px;margin-top:14px}
.dlg-actions button{flex:1;padding:9px;border-radius:7px;border:1px solid var(--bd);background:var(--sf);font-family:var(--mn);font-size:11px;font-weight:600;cursor:pointer}
.dlg-actions button:hover{border-color:var(--ink)}
.dlg-form{margin-top:12px;display:none}
.dlg-form.show{display:block}
.dlg-form input,.dlg-form textarea,.dlg-form select{width:100%;background:#fff;border:1px solid var(--bd);border-radius:6px;padding:8px 10px;font-size:12.5px;margin-top:6px;font-family:var(--sn)}
.dlg-form button.submit{margin-top:10px;width:100%;background:var(--acc);color:#fff;border:none;padding:9px;border-radius:7px;font-family:var(--dp);font-weight:700;cursor:pointer}
.kardex-hist{margin-top:10px}
.kh-item{display:flex;justify-content:space-between;font-size:11px;padding:6px 0;border-bottom:1px solid var(--bd)}
.kh-item:last-child{border-bottom:none}
.sal-svc{margin-bottom:16px}
.sal-svc-hdr{font-family:var(--dp);font-weight:800;font-size:13px;padding:8px 12px;border-radius:8px 8px 0 0;background:var(--ink);color:#fff;display:flex;justify-content:space-between}
.sal-prep{border:1px solid var(--bd);border-top:none}
.sal-prep-hdr{font-weight:800;font-size:17px;padding:10px 14px;background:#FFD400;color:var(--ink);border-radius:6px;margin:6px 0 0 0;border-bottom:none}
.mov-row{display:flex;align-items:center;gap:12px;padding:11px 14px;border:1px solid var(--bd);border-radius:8px;margin-bottom:8px;background:var(--sf);cursor:pointer}
.mov-row:hover{border-color:var(--acc)}
.mov-date{font-family:var(--mn);font-size:10.5px;color:var(--mut);width:76px;flex-shrink:0}
.mov-info{flex:1;min-width:0}
.mov-name{font-weight:600;font-size:12.5px}
.mov-motivo{font-size:11px;color:var(--mut);margin-top:2px}
.mov-badge{font-family:var(--mn);font-size:10px;font-weight:700;padding:4px 10px;border-radius:99px;white-space:nowrap}
.mov-badge.devolucion{background:var(--dgl);color:var(--dg)}
.mov-badge.adicional{background:var(--okl);color:var(--ok)}
.mov-qty{font-family:var(--mn);font-size:12.5px;font-weight:700;width:70px;text-align:right;flex-shrink:0}
.sync-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.sync-dot.on{background:var(--ok)}
.sync-dot.off{background:var(--mut)}
.sync-card{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:18px;max-width:520px}
.sync-card input{width:100%;background:#fff;border:1px solid var(--bd);border-radius:6px;padding:9px 11px;font-size:12.5px;font-family:var(--mn);margin:8px 0}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:6px 16px}
.panel-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:20px}
.panel-card{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:16px}
.panel-card .pc-num{font-family:var(--dp);font-size:26px;font-weight:800}
.pc-num-stock{font-family:var(--mn)!important;font-size:38px!important;font-weight:800;color:#000!important}
.panel-card .pc-lbl{font-size:11.5px;color:var(--mut);margin-top:4px}
.panel-card.warn .pc-num{color:var(--dg)}
.feed-item{display:flex;gap:12px;padding:9px 0;border-bottom:1px solid var(--bd);font-size:12.5px}
.feed-item:last-child{border-bottom:none}
.feed-time{font-family:var(--mn);font-size:10.5px;color:var(--mut);width:80px;flex-shrink:0}
@media print{
  .sb,.topbar,.bar,.no-print{display:none!important}
  .app{display:block;height:auto;overflow:visible}
  .main{padding:0;overflow:visible;height:auto}
  body{background:#fff}
  .modhead{position:static}
}

<script>
const CATALOG = JSON.parse(document.getElementById('catalogData').textContent);
// Varios productos pueden compartir el mismo codigo de compra (ej. los fideos
// cortos 90600020189). Internamente cada uno lleva un identificador propio
// (-A, -B...) para tener su propio ingreso, salida y stock; en pantalla se
// muestra siempre el codigo sin la letra.
function dispCod(id){ return String(id).replace(/-[A-Z]$/,''); }
let INGRESO_DATA = {};
async function decompressB64(b64){
  const bin=atob(b64),bytes=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
  const ds=new DecompressionStream('gzip'),w=ds.writable.getWriter();
  w.write(bytes);w.close();
  const out=[],r=ds.readable.getReader();
  while(true){const{value,done}=await r.read();if(done)break;out.push(value);}
  const tot=out.reduce((a,b)=>a+b.length,0),m=new Uint8Array(tot);
  let off=0;for(const c of out){m.set(c,off);off+=c.length;}
  return JSON.parse(new TextDecoder().decode(m));
}

const LS_INGRESO = 'catalogo_maestro_ingreso_APP2_v1';
// Guardado "a prueba de fallos": si localStorage.setItem falla (por ejemplo,
// almacenamiento lleno), antes quedaba en silencio -- el ingreso se veia
// marcado en pantalla pero nunca se guardaba de verdad, y se perdia al
// cerrar y reabrir. Ahora cualquier fallo muestra un aviso imposible de
// ignorar, en vez de perderse sin que nadie se entere.
function safeLocalSet(key, value){
  try{
    localStorage.setItem(key, value);
    if(document.getElementById('storageErrBanner')) document.getElementById('storageErrBanner').remove();
    return true;
  }catch(e){
    console.error('Error guardando '+key, e);
    mostrarAvisoAlmacenamiento();
    return false;
  }
}
function mostrarAvisoAlmacenamiento(){
  if(document.getElementById('storageErrBanner')) return;
  const b = document.createElement('div');
  b.id = 'storageErrBanner';
  b.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:99999;background:#B8140A;color:#fff;padding:12px 16px;font-weight:800;text-align:center;font-size:14px;box-shadow:0 2px 8px rgba(0,0,0,.3)';
  b.innerHTML = '&#9888; No se pudo guardar en este dispositivo (almacenamiento lleno). Los ultimos cambios NO se guardaron. Ve a Sincronizacion &gt; Espacio usado.';
  document.body.prepend(b);
}
function espacioUsadoLS(){
  let bytes = 0;
  try{
    for(let i=0;i<localStorage.length;i++){
      const k = localStorage.key(i);
      bytes += (k.length + (localStorage.getItem(k)||'').length) * 2; // UTF-16, aprox
    }
  }catch(e){}
  return bytes;
}
let ING_STATE = {};
let ING_DATE = localStorage.getItem('catalogo_maestro_ing_fecha_APP2_v1') || null;
function loadIngresoLS(){ try{ const r = localStorage.getItem(LS_INGRESO); if(r) ING_STATE = JSON.parse(r); }catch(e){} }
function saveIngresoLS(){ return safeLocalSet(LS_INGRESO, JSON.stringify(ING_STATE)); }
function migrarIngresoAClaveCompuesta(){
  let cambios = false;
  Object.entries(ING_STATE).forEach(([fecha, day])=>{
    const items = day.items || {};
    const nuevos = {};
    const usados = new Set();
    Object.entries(items).forEach(([key, entry])=>{
      // ya migrado a la version con entregaId real que existe en INGRESO_DATA de esta fecha
      if(entry.entregaId && (INGRESO_DATA[fecha]||[]).some(x=>x.id===entry.entregaId)){
        nuevos[entry.entregaId] = entry; usados.add(entry.entregaId); return;
      }
      // determinar codigo/oc segun el formato de la clave vieja
      let codigo = entry.codigo, oc = entry.oc;
      if(codigo===undefined){
        if(key.includes('||')){ const parts = key.split('||'); codigo = parts[0]; oc = parts[1]; }
        else { codigo = key; }
      }
      // buscar la entrega real de INGRESO_DATA que corresponda (primera libre con ese codigo/oc)
      const candidatos = (INGRESO_DATA[fecha]||[]).filter(x=>x.codigo===codigo && (oc===undefined || oc==='' || x.oc===oc) && !usados.has(x.id));
      const target = candidatos[0] || (INGRESO_DATA[fecha]||[]).find(x=>x.codigo===codigo && !usados.has(x.id));
      const entregaId = target ? target.id : key;
      entry.entregaId = entregaId;
      entry.codigo = codigo;
      entry.oc = target ? target.oc : oc;
      nuevos[entregaId] = entry;
      usados.add(entregaId);
      cambios = true;
    });
    day.items = nuevos;
  });
  if(cambios) saveIngresoLS();
}
// Si una correccion de cronograma mueve un item a otra fecha, una
// confirmacion HECHA ANTES de esa correccion se queda guardada bajo la
// fecha vieja (el Kardex la mostraba en el dia original, no en el actual
// del cronograma). Esto la realinea automaticamente a la fecha correcta,
// para que una actualizacion de la app nunca deje un ingreso ya confirmado
// "mal ubicado".
function migrarFechasIngresoDesincronizadas(){
  // OJO: el id (codigo_oc_cantidad) NO es unico en todo el cronograma -- el
  // mismo producto puede entregarse con la misma cantidad en varias fechas
  // distintas. Por eso esto solo mueve una confirmacion cuando es 100%
  // inequivoco: el id no existe en su fecha actual, Y existe en
  // EXACTAMENTE una sola otra fecha del cronograma. Si aparece en varias
  // fechas (o en ninguna), no se toca nada -- mejor dejarlo como esta que
  // adivinar mal y mover algo a la fecha equivocada.
  const fechasPorId = {};
  Object.keys(INGRESO_DATA).forEach(fecha=>{
    (INGRESO_DATA[fecha]||[]).forEach(it=>{
      (fechasPorId[it.id] || (fechasPorId[it.id]=[])).push(fecha);
    });
  });
  let cambios = false;
  Object.keys(ING_STATE).forEach(fechaActual=>{
    const items = ING_STATE[fechaActual].items || {};
    Object.keys(items).forEach(entregaId=>{
      const fechas = fechasPorId[entregaId] || [];
      if(fechas.includes(fechaActual)) return; // ya esta bien ubicado, no tocar
      if(fechas.length === 1){
        const fechaCorrecta = fechas[0];
        const entry = items[entregaId];
        delete items[entregaId];
        if(!ING_STATE[fechaCorrecta]) ING_STATE[fechaCorrecta] = {items:{}};
        ING_STATE[fechaCorrecta].items[entregaId] = entry;
        cambios = true;
      }
    });
  });
  if(cambios) saveIngresoLS();
}

function calcularSaldo(codigo){
  const inicial = STOCK_INICIAL[codigo]?.stock;
  let saldo = inicial || 0;
  let tieneBase = inicial != null;
  // + Ingresos confirmados (OK) - puede haber varias entregas (distintas OC/entregas) el mismo dia
  Object.values(ING_STATE).forEach(day=>{
    Object.entries(day.items||{}).forEach(([key,e])=>{
      const entryCodigo = e.codigo || key.split('||')[0].split('_')[0];
      if(entryCodigo===codigo && e.state==='ok' && e.rec!=null) saldo += e.rec;
    });
  });
  // - Salidas confirmadas (buscando por codigo dentro de SAL_DOSIF)
  Object.entries(SAL_STATE).forEach(([fecha, day])=>{
    Object.entries(day.items||{}).forEach(([key, entry])=>{
      if(entry.rec==null) return;
      const [srv, prep, nb] = key.split('||');
      const prodList = SAL_DOSIF[fecha]?.[srv]?.[prep] || [];
      const prod = prodList.find(p=>p.n===nb);
      if(prod && prod.cod===codigo) saldo -= entry.rec;
    });
  });
  // + Devoluciones, - Pedidos adicionales
  (KARDEX[codigo]||[]).forEach(m=>{
    if(m.tipo==='devolucion') saldo += m.cantidad;
    else if(m.tipo==='adicional') saldo -= m.cantidad;
  });
  return {saldo, tieneBase};
}
function construirKardexLedger(codigo){
  const movs = [];
  // Ingresos confirmados
  Object.entries(ING_STATE).forEach(([fecha, day])=>{
    Object.entries(day.items||{}).forEach(([key, e])=>{
      const entryCodigo = e.codigo || key.split('||')[0].split('_')[0];
      if(entryCodigo===codigo && e.state==='ok' && e.rec!=null){
        movs.push({fecha, ref: e.fechaReposicion?'REPOSICION':'INGRESO', entrada: e.rec, salida: 0, hora: e.horaOK||'', prioridad:0, tipo:'ingreso', entregaId:key});
      }
    });
  });
  // Salidas confirmadas (buscando el codigo dentro de SAL_DOSIF)
  Object.entries(SAL_STATE).forEach(([fecha, day])=>{
    Object.entries(day.items||{}).forEach(([key, entry])=>{
      if(entry.rec==null) return;
      const [srv, prep, nb] = key.split('||');
      const prodList = SAL_DOSIF[fecha]?.[srv]?.[prep] || [];
      const prod = prodList.find(p=>p.n===nb);
      if(prod && prod.cod===codigo){
        movs.push({fecha, ref: (srv||'').slice(0,3).toUpperCase(), entrada: 0, salida: entry.rec, hora: entry.hora||'', prioridad:1, tipo:'salida'});
      }
    });
  });
  // Devoluciones y Pedidos adicionales
  (KARDEX[codigo]||[]).forEach(m=>{
    if(m.tipo==='devolucion') movs.push({fecha: m.fecha, ref:'DEVOLUCION', entrada: m.cantidad, salida: 0, hora:'', prioridad:2, tipo:'devolucion', syncId:m._syncId});
    else if(m.tipo==='adicional') movs.push({fecha: m.fecha, ref:'PEDIDO ADICIONAL', entrada: 0, salida: m.cantidad, hora:'', prioridad:3, tipo:'adicional', syncId:m._syncId});
  });
  movs.sort((a,b)=> a.fecha!==b.fecha ? a.fecha.localeCompare(b.fecha) : (a.prioridad!==b.prioridad ? a.prioridad-b.prioridad : a.hora.localeCompare(b.hora)));
  let saldo = STOCK_INICIAL[codigo]?.stock || 0;
  const rows = [];
  if(STOCK_INICIAL[codigo]){
    rows.push({fecha: STOCK_INICIAL[codigo].fecha, ref:'INVENTARIO INICIAL', entrada:'-', salida:'-', saldo: saldo.toFixed(3)});
  }
  movs.forEach(m=>{
    saldo = saldo + m.entrada - m.salida;
    rows.push({fecha: m.fecha, ref: m.ref, entrada: m.entrada||'-', salida: m.salida||'-', saldo: saldo.toFixed(3), tipo:m.tipo, syncId:m.syncId, entregaId:m.entregaId});
  });
  return rows;
}

  // Salida = azul, Ingreso/Reposicion = rojo, Devolucion/Pedido adicional = negro (mas intenso y en negrita).
  const colorPorTipo = {salida:'#1554d1', ingreso:'#c81e1e', devolucion:'#111111', adicional:'#111111'};

      <td style="padding:7px 8px;font-size:14px">${ev(r.ref)}${btn}</td>
      <td style="padding:7px 8px;text-align:right;font-size:16px;font-weight:${fw};color:${color}">${r.entrada}</td>
      <td style="padding:7px 8px;text-align:right;font-size:16px;font-weight:${fw};color:${color}">${r.salida}</td>
      <td style="padding:7px 8px;text-align:right;font-size:16px;font-weight:800">${r.saldo}</td>

  });
  h += '</tbody></table></div>';
  return h;

function nearestFechaConDosif(fecha){
  const fechas = Object.keys(SAL_DOSIF).sort();
  if(!fechas.length) return null;
  const after = fechas.find(f=>f>=fecha);
  const before = [...fechas].reverse().find(f=>f<=fecha);
  if(after && before) return (Math.abs(new Date(after)-new Date(fecha)) <= Math.abs(new Date(fecha)-new Date(before))) ? after : before;
  return after || before;
}

async function toggleScan(){
  if(scanStream){ stopScan(); return; }
  const video = document.getElementById('scanVideo');
  const btn = document.getElementById('scanToggleBtn');
  const msg = document.getElementById('scanMsg');
  try{
    scanStream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
    video.srcObject = scanStream;
    await video.play();
    btn.innerHTML = '&#9632; Detener camara';
    msg.textContent = 'Buscando codigo QR...';
    scanCooldown = false;
    scanLoop();
  }catch(e){
    msg.textContent = 'No se pudo acceder a la camara. Usa la busqueda manual.';
    toast('Camara no disponible: '+e.message);
  }
}
function stopScan(){
  if(scanStream){ scanStream.getTracks().forEach(t=>t.stop()); scanStream = null; }
  if(scanRAF) cancelAnimationFrame(scanRAF);
  const btn = document.getElementById('scanToggleBtn');
  if(btn) btn.innerHTML = '&#128247; Iniciar camara';
  const msg = document.getElementById('scanMsg');
  if(msg) msg.textContent = 'Toca "Iniciar camara" para comenzar';
}
function scanLoop(){
  const video = document.getElementById('scanVideo');
  if(!video || !scanStream) return;
  const canvas = document.createElement('canvas');
  const tick = ()=>{
    if(!scanStream) return;
    if(video.readyState === video.HAVE_ENOUGH_DATA){
      canvas.width = video.videoWidth; canvas.height = video.videoHeight;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      const img = ctx.getImageData(0,0,canvas.width,canvas.height);
      const code = jsQR(img.data, img.width, img.height);
      if(code && code.data && !scanCooldown){
        const it = resolveCode(code.data);
        const frame = document.getElementById('scanFrame');
        if(it){
          scanCooldown = true;
          if(frame) frame.classList.add('hit');
          const msg = document.getElementById('scanMsg');
          if(msg) msg.textContent = 'Encontrado: '+it.nombre;
          pushRecent(it.id);
          setTimeout(()=>{ showFicha(it.id); if(frame) frame.classList.remove('hit'); scanCooldown=false; }, 350);
        }
      }
    }
    scanRAF = requestAnimationFrame(tick);
  };
  scanRAF = requestAnimationFrame(tick);
}

function fechasConEntrega(){ return Object.keys(INGRESO_DATA).sort(); }
const LS_SALIDA = 'catalogo_maestro_salida_APP2_v1';
let SAL_DOSIF = {};
let SAL_STATE = {};
let SAL_DATE = localStorage.getItem('catalogo_maestro_sal_fecha_APP2_v1') || null;
const SRV_ORD = ['DESAYUNO','ALMUERZO','CENA'];
function loadSalidaLS(){ try{ const r = localStorage.getItem(LS_SALIDA); if(r) SAL_STATE = JSON.parse(r); }catch(e){} }
function saveSalidaLS(){ return safeLocalSet(LS_SALIDA, JSON.stringify(SAL_STATE)); }
function salK(s,p,n,cantidad,oc,idx){
  // El indice solo se agrega a la clave desde la 2a aparicion en adelante
  // (idx>0), asi todo producto que no se repite conserva exactamente la
  // misma clave de siempre (compatibilidad total con datos ya guardados).
  // Solo los duplicados (mismo turno+prep+nombre+cantidad+oc) quedan con
  // una clave propia por posicion, para que confirmar uno no marque al otro.
  const base = s+'||'+p+'||'+n + (cantidad!=null ? '||'+cantidad : '') + (oc!=null ? '||'+oc : '');
  return (idx!=null && idx>0) ? base+'||#'+idx : base;
}
function salApsFor(d){
  // idx debe contar SOLO repeticiones del mismo producto (n+cantidad+oc)
  // dentro de esa preparacion -- NO la posicion cruda en la lista de
  // ingredientes (eso rompia la clave de casi todos los productos, no
  // solo los duplicados reales).
  const ps=[], day=SAL_DOSIF[d]||{};
  SRV_ORD.forEach(s=>{
    if(!day[s]) return;
    Object.entries(day[s]).forEach(([p,prds])=>{
      const contados = {};
      prds.forEach(pr=>{
        const dupKey = pr.n+'||'+pr.c+'||'+(pr.oc!=null?pr.oc:'');
        const idx = contados[dupKey] || 0;
        contados[dupKey] = idx+1;
        ps.push({s,p,pr,idx});
      });
    });
  });
  return ps;
}
function salIst(d,s,p,prod,idx){
  const items = SAL_STATE[d]?.items;
  if(!items) return 'pend';
  if(items[salK(s,p,prod.n,prod.c,prod.oc,idx)]?.rec!=null) return 'ok';
  if(items[salK(s,p,prod.n,prod.c,undefined,idx)]?.rec!=null) return 'ok';
  if(items[salK(s,p,prod.n,undefined,undefined,idx)]?.rec!=null) return 'ok';
  // Formatos MAS antiguos (de antes de que existiera el concepto de "idx"
  // / posicion): sin idx en absoluto. Sin esto, cualquier salida confirmada
  // antes de esa mejora queda invisible para siempre al revisarla hoy.
  if(items[salK(s,p,prod.n,prod.c,prod.oc)]?.rec!=null) return 'ok';
  if(items[salK(s,p,prod.n,prod.c)]?.rec!=null) return 'ok';
  if(items[salK(s,p,prod.n)]?.rec!=null) return 'ok';
  return 'pend';
}
function salConfirmarOK(d,s,p,nb,cantidad,oc,idx){
  if(!SAL_STATE[d]) SAL_STATE[d] = {items:{}};
  const hora = new Date().toTimeString().slice(0,5);
  const ts = Date.now();
  SAL_STATE[d].items[salK(s,p,nb,cantidad,oc,idx)] = {rec: cantidad, hora, ts};
  saveSalidaLS();
  pushEvento('salida_ok', {fecha:d, s, p, nb, cantidad, oc, hora, ts, idx});
  logActividad('Salida confirmada: '+nb+' ('+p+') — '+cantidad);
  render();
  toast('Salida confirmada ('+hora+')');
}
function salDeshacer(d,s,p,nb,cantidad,oc,idx){
  if(SAL_STATE[d]?.items){
    delete SAL_STATE[d].items[salK(s,p,nb,cantidad,oc,idx)];
    delete SAL_STATE[d].items[salK(s,p,nb,cantidad,undefined,idx)];
    delete SAL_STATE[d].items[salK(s,p,nb,undefined,undefined,idx)];
    // Formatos mas antiguos (de antes de que existiera "idx"):
    delete SAL_STATE[d].items[salK(s,p,nb,cantidad,oc)];
    delete SAL_STATE[d].items[salK(s,p,nb,cantidad)];
    delete SAL_STATE[d].items[salK(s,p,nb)];
  }
  saveSalidaLS();
  pushEvento('salida_undo', {fecha:d, s, p, nb, cantidad, oc, ts: Date.now(), idx});
  logActividad('Salida deshecha: '+nb);
  render();
  toast('Confirmacion deshecha');
}

// ===================== MODULO DISTRIBUCION =====================
// Pensado para perecibles (verduras, frutas, carnicos, embutidos, huevos):
// se trabaja por ENTREGA DEL DIA (ej. "hoy llegaron 70kg de ajo"). Cada
// entrega confirmada en Ingreso es su propio presupuesto: se distribuye
// solo entre las preparaciones que esos kilos alcanzan a cubrir, en orden
// cronologico desde la FECHA DE ESA ENTREGA en adelante (nunca mira atras,
// para no atascarse con backlog viejo sin resolver).
//
// Que especificamente distribuyo CADA entrega se guarda en un registro
// propio (DISTRIB_STATE) para que, si el mismo producto vuelve a ingresar
// en una entrega mas nueva, cada una mantenga su propio avance por
// separado -- la entrega nueva no hereda ni repite lo que ya mostro una
// entrega anterior del mismo producto. Las preparaciones candidatas a
// distribuir siempre se toman de lo que TODAVIA esta pendiente en Salida
// (sin importar si se confirmo desde aqui o desde el modulo de Salida
// normal), asi nunca se ofrece distribuir algo que alguien ya hizo.
const DISTRIB_RUBROS = ['CARNE DE AVES','CARNE DE CERDO','CARNE DE PESCADO','CARNE DE RES','EMBUTIDOS Y LACTEOS','FRUTA','HUEVOS','VERDURAS Y TUBERCULOS'];
const SRV_ORDEN_IDX = {DESAYUNO:0, ALMUERZO:1, CENA:2};
let DISTRIB_DATE = null;
let DISTRIB_SEL = null; // {fechaEntrega, entregaId}
let DISTRIB_VISTA = 'accion'; // 'accion' | 'resumen'
const LS_DISTRIB = 'catalogo_maestro_distrib_APP2_v2';
let DISTRIB_STATE = {};
function loadDistribLS(){ try{ const r = localStorage.getItem(LS_DISTRIB); if(r) DISTRIB_STATE = JSON.parse(r); }catch(e){} }
// Migracion de una sola vez: el registro por-entrega de Distribucion (DISTRIB_STATE)
// es nuevo. Si un producto nunca tuvo ninguna entrega con registro propio
// pero YA existen confirmaciones de Salida de antes de este cambio, se
// reconstruye repartiendo esas confirmaciones ya hechas entre sus entregas,
// en orden, para que no aparezcan como "sin distribuir" y se vuelvan a
// ofrecer para distribuir por segunda vez.
function migrarDistribLedgerSiNecesario(){
  let cambios = false;
  const porCodigo = {};
  Object.keys(INGRESO_DATA).sort().forEach(fecha=>{
    (INGRESO_DATA[fecha]||[]).forEach(it=>{
      const e = ingEntry(fecha, it.id);
      if(e?.state!=='ok') return;
      const cat = CATALOG.find(c=>c.id===it.codigo);
      if(!cat || !DISTRIB_RUBROS.includes(cat.rubro)) return;
      (porCodigo[it.codigo] || (porCodigo[it.codigo]=[])).push({fecha, entregaId:it.id, rec:e.rec});
    });
  });
  Object.entries(porCodigo).forEach(([codigo, entregas])=>{
    const yaTieneAlgun = entregas.some(ent => distribAsignados(ent.fecha, ent.entregaId).length>0);
    if(yaTieneAlgun) return; // ya se uso el sistema nuevo para este producto, no tocar
    const todos = itemsCodigoDesde(codigo, entregas[0].fecha);
    let cursor = 0;
    entregas.forEach(ent=>{
      let acumulado = 0;
      const asign = [];
      while(cursor < todos.length && todos[cursor].estado==='ok' && acumulado + todos[cursor].cantidad <= ent.rec + 0.0001){
        acumulado += todos[cursor].cantidad;
        asign.push({fecha:todos[cursor].fecha, turno:todos[cursor].turno, prep:todos[cursor].prep, nombre:todos[cursor].nombre, cantidad:todos[cursor].cantidad, medida:todos[cursor].medida});
        cursor++;
      }
      if(asign.length){
        DISTRIB_STATE[distribKey(ent.fecha, ent.entregaId)] = asign;
        cambios = true;
      }
    });
  });
  if(cambios) saveDistribLS();
}
function saveDistribLS(){ return safeLocalSet(LS_DISTRIB, JSON.stringify(DISTRIB_STATE)); }
function distribKey(fechaEntrega, entregaId){ return fechaEntrega+'||'+entregaId; }
function distribAsignados(fechaEntrega, entregaId){
  const v = DISTRIB_STATE[distribKey(fechaEntrega, entregaId)];
  return Array.isArray(v) ? v : [];
}
function guardarAsignados(fechaEntrega, entregaId, arr){
  const key = distribKey(fechaEntrega, entregaId);
  DISTRIB_STATE[key] = arr;
  saveDistribLS();
  pushEvento('distrib_set', {key, valor: arr, ts: Date.now()});
}
function ordenPlan(a,b){
  return a.fecha!==b.fecha ? a.fecha.localeCompare(b.fecha)
    : ((SRV_ORDEN_IDX[a.turno]??9)-(SRV_ORDEN_IDX[b.turno]??9)) || a.prep.localeCompare(b.prep);
}
function fechasConEntregaDistrib(){
  return fechasConEntrega().filter(f=>{
    return (INGRESO_DATA[f]||[]).some(it=>{
      const e = ingEntry(f, it.id);
      if(e?.state!=='ok') return false;
      const cat = CATALOG.find(c=>c.id===it.codigo);
      return cat && DISTRIB_RUBROS.includes(cat.rubro);
    });
  });
}
function nextFechaConEntregaDistrib(dir){
  const fechas = fechasConEntregaDistrib();
  if(!fechas.length) return DISTRIB_DATE;
  const hoy = new Date().toISOString().slice(0,10);
  const base = DISTRIB_DATE || hoy;
  if(dir>0){ return fechas.find(f=>f>base) || fechas[fechas.length-1]; }
  else { return [...fechas].reverse().find(f=>f<base) || fechas[0]; }
}
function setDistribDate(v){ DISTRIB_DATE = v; DISTRIB_SEL = null; render(); }
// Grupos de productos que son CONTINUACION unos de otros (mismo stock real
// bajo distinto codigo/nombre en el catalogo, ej. cuando un contrato viejo
// y uno nuevo terminan siendo el mismo insumo). Esto SOLO afecta el
// arrastre de saldo y las preparaciones candidatas en Distribucion -- el
// Kardex y el saldo de cada codigo individual siguen siendo independientes.
const GRUPOS_CONTINUACION = [
  ['90600020031','90600020190'], // FIDEO TALLARIN N 32 -> FIDEO LARGO
  ['90600020069','90600020189-A'], // FIDEO ARITO -> FIDEO CORTO (CORTADO) - ARITO
  ['90600020044','90600020189-D'], // FIDEO TORNILLO -> FIDEO CORTO (CORTADO) - TORNILLO
  ['90600020041','90600020189-B'], // FIDEO CANUTO CHICO -> FIDEO CORTO (CORTADO) - CANUTO CHICO
];
function codigosDelGrupo(codigo){
  const grupo = GRUPOS_CONTINUACION.find(g=>g.includes(codigo));
  return grupo || [codigo];
}
// Todas las preparaciones de uno o varios codigos (grupo de continuacion)
// desde una fecha en adelante, con su estado real de Salida en este momento.
function restarDias(fechaStr, dias){
  const d = new Date(fechaStr+'T00:00:00');
  d.setDate(d.getDate()-dias);
  return d.toISOString().slice(0,10);
}
function itemsCodigoDesde(codigos, fechaMin){
  const lista = Array.isArray(codigos) ? codigos : [codigos];
  const out = [];
  Object.keys(SAL_DOSIF).sort().forEach(fecha=>{
    if(fecha < fechaMin) return;
    const day = SAL_DOSIF[fecha];
    SRV_ORD.forEach(turno=>{
      if(!day[turno]) return;
      Object.entries(day[turno]).forEach(([prep,prods])=>{
        const contados = {};
        prods.forEach(p=>{
          const dupKey = p.n+'||'+p.c+'||'+(p.oc!=null?p.oc:'');
          const idx = contados[dupKey] || 0;
          contados[dupKey] = idx+1;
          if(lista.includes(p.cod)){
            out.push({fecha,turno,prep,nombre:p.n,cantidad:p.c,medida:p.m,oc:p.oc,idx,
              estado: salIst(fecha,turno,prep,p,idx)==='ok' ? 'ok' : 'pendiente'});
          }
        });
      });
    });
  });
  return out; // orden cronologico, solo desde fechaMin en adelante
}
// Entregas confirmadas de un dia, solo rubros perecibles, con lo ya
// distribuido y lo restante (calculado via el registro propio de la entrega).
function entregasDelDia(fecha){
  return (INGRESO_DATA[fecha]||[]).map(it=>{
    const e = ingEntry(fecha, it.id);
    const cat = CATALOG.find(c=>c.id===it.codigo);
    return {it, e, cat};
  }).filter(x=>x.e?.state==='ok' && x.cat && DISTRIB_RUBROS.includes(x.cat.rubro))
    .map(x=>{
      const {distribuido, restante} = planEntrega(fecha, x.it.id);
      return {...x, distribuido, restante};
    });
}
// Plan de una entrega: lo que YA se distribuyo especificamente a traves de
// esta entrega (su propio registro) + lo siguiente que su presupuesto
// alcance a cubrir, tomado SOLO de lo que sigue pendiente en Salida (por
// cualquier via) desde la fecha de esta entrega en adelante. Nunca mira
// atras ni reclama algo que otra entrega ya distribuyo.
//
// El presupuesto de una entrega es su propia cantidad recibida MAS el saldo
// que le quedo sin usar a la entrega anterior del mismo producto (el saldo
// es stock real que no se pierde, se va acumulando entrega tras entrega
// hasta que se termina de distribuir).
function planEntrega(fechaEntrega, entregaId){
  const it = (INGRESO_DATA[fechaEntrega]||[]).find(x=>x.id===entregaId);
  const e = ingEntry(fechaEntrega, entregaId);
  if(!it || e?.state!=='ok') return {it:null};
  const grupo = codigosDelGrupo(it.codigo);
  const entregas = [];
  Object.keys(INGRESO_DATA).sort().forEach(f=>{
    (INGRESO_DATA[f]||[]).forEach(x=>{
      if(!grupo.includes(x.codigo)) return;
      const ee = ingEntry(f, x.id);
      if(ee?.state==='ok') entregas.push({fecha:f, entregaId:x.id, rec:ee.rec});
    });
  });
  let carry = 0;
  let resultado = null;
  for(const ent of entregas){
    const presupuesto = ent.rec + carry;
    // Auto-sanacion: solo se cuenta como "ya distribuido" lo que el registro
    // dice Y que ademas siga confirmado de verdad en Salida ahora mismo. Si
    // algo se deshizo desde el modulo de Salida (o el registro quedo
    // desincronizado por cualquier otro motivo), se limpia solo aqui -- ya
    // no se queda pegado mostrando "distribuido" sin poder deshacerlo.
    const asignadosRaw = distribAsignados(ent.fecha, ent.entregaId);
    const asignados = asignadosRaw.filter(a => salIst(a.fecha, a.turno, a.prep, {n:a.nombre, c:a.cantidad, oc:a.oc}, a.idx) === 'ok');
    if(asignados.length !== asignadosRaw.length){
      guardarAsignados(ent.fecha, ent.entregaId, asignados);
    }
    const distribuido = asignados.reduce((s,a)=>s+a.cantidad,0);
    const restanteLocal = Math.max(0, presupuesto - distribuido);
    // Puede cubrir algo pendiente hasta 5 dias ANTES de su propia fecha
    // (para ajustes de fecha por facturacion), pero no mas atras que eso --
    // asi no se atasca con backlog viejo de meses.
    const candidatos = itemsCodigoDesde(grupo, restarDias(ent.fecha, 5)).filter(x=>x.estado==='pendiente');
    const siguientes = [];
    let acumulado = 0;
    for(const x of candidatos){
      if(acumulado + x.cantidad > restanteLocal + 0.0001) break;
      acumulado += x.cantidad;
      siguientes.push(x);
    }
    const primerPendienteLocal = candidatos[siguientes.length] || null;
    const plan = asignados.map(a=>({...a, estado:'ok'})).concat(siguientes.map(x=>({...x, estado:'pendiente'}))).sort(ordenPlan);
    if(ent.fecha===fechaEntrega && ent.entregaId===entregaId){
      resultado = {it, e, distribuido, restante: restanteLocal, plan, primerPendiente: primerPendienteLocal, presupuesto, carryRecibido: carry, atrasado:[]};
    }
    carry = restanteLocal;
  }
  return resultado || {it, e, distribuido:0, restante:e.rec, plan:[], primerPendiente:null, presupuesto:e.rec, carryRecibido:0, atrasado:[]};
}

function stockDisponible(codigo){
  if(!codigo) return null;
  const {saldo, tieneBase} = calcularSaldo(codigo);
  return {saldo, tieneBase};
}
// Calcula el saldo de TODOS los codigos en una sola pasada por el historial,
// en vez de recorrer todo el historial una vez por cada producto (que era
// lo que colgaba la app en dispositivos menos potentes tras semanas de uso).
function calcularTodosLosSaldos(){
  const mapa = {};
  const get = codigo => mapa[codigo] || (mapa[codigo] = {saldo: (STOCK_INICIAL[codigo]?.stock)||0, tieneBase: STOCK_INICIAL[codigo]!=null});
  // Asegura que todo producto con stock inicial aparezca en el mapa, aunque
  // todavia no tenga ningun movimiento de ingreso/salida/kardex registrado
  // (antes se saltaba por completo y el Stock no se mostraba en Salida).
  Object.keys(STOCK_INICIAL).forEach(codigo => get(codigo));
  Object.values(ING_STATE).forEach(day=>{
    Object.entries(day.items||{}).forEach(([key,e])=>{
      const entryCodigo = e.codigo || key.split('||')[0].split('_')[0];
      if(e.state==='ok' && e.rec!=null) get(entryCodigo).saldo += e.rec;
    });
  });
  Object.entries(SAL_STATE).forEach(([fecha, day])=>{
    Object.entries(day.items||{}).forEach(([key, entry])=>{
      if(entry.rec==null) return;
      const [srv, prep, nb] = key.split('||');
      const prodList = SAL_DOSIF[fecha]?.[srv]?.[prep] || [];
      const prod = prodList.find(p=>p.n===nb);
      if(prod) get(prod.cod).saldo -= entry.rec;
    });
  });
  Object.entries(KARDEX).forEach(([codigo, movs])=>{
    (movs||[]).forEach(m=>{
      if(m.tipo==='devolucion') get(codigo).saldo += m.cantidad;
      else if(m.tipo==='adicional') get(codigo).saldo -= m.cantidad;
    });
  });
  return mapa;
}
// ===================== REPORTE MENSUAL (Ingreso/Salida/Inventario por OC) =====================
// Mismo calculo que calcularTodosLosSaldos, pero solo contando movimientos
// con fecha <= fechaCorte -- para saber el stock que quedaba en un cierre
// de mes pasado, no el saldo de ahora mismo.
function calcularSaldosAlCorte(fechaCorte){
  const mapa = {};
  const get = codigo => mapa[codigo] || (mapa[codigo] = {saldo: (STOCK_INICIAL[codigo]?.stock)||0});
  Object.keys(STOCK_INICIAL).forEach(codigo => get(codigo));
  Object.entries(ING_STATE).forEach(([fecha, day])=>{
    if(fecha > fechaCorte) return;
    Object.entries(day.items||{}).forEach(([key,e])=>{
      const entryCodigo = e.codigo || key.split('||')[0].split('_')[0];
      if(e.state==='ok' && e.rec!=null) get(entryCodigo).saldo += e.rec;
    });
  });
  Object.entries(SAL_STATE).forEach(([fecha, day])=>{
    if(fecha > fechaCorte) return;
    Object.entries(day.items||{}).forEach(([key, entry])=>{
      if(entry.rec==null) return;
      const [srv, prep, nb] = key.split('||');
      const prodList = SAL_DOSIF[fecha]?.[srv]?.[prep] || [];
      const prod = prodList.find(p=>p.n===nb);
      if(prod) get(prod.cod).saldo -= entry.rec;
    });
  });
  Object.entries(KARDEX).forEach(([codigo, movs])=>{
    (movs||[]).forEach(m=>{
      if(m.fecha > fechaCorte) return;
      if(m.tipo==='devolucion') get(codigo).saldo += m.cantidad;
      else if(m.tipo==='adicional') get(codigo).saldo -= m.cantidad;
    });
  });
  return mapa;
}
// Suma, por OC y luego por producto, cuanto se confirmo de INGRESO dentro
// de un rango de fechas (usa la OC real de cada entrega, no la del catalogo,
// porque el mismo producto puede venir de OCs distintas en distintos meses).
function resumenIngresoPorOC(fechaIni, fechaFin){
  const porOC = {};
  Object.keys(INGRESO_DATA).sort().forEach(fecha=>{
    if(fecha < fechaIni || fecha > fechaFin) return;
    (INGRESO_DATA[fecha]||[]).forEach(it=>{
      const e = ingEntry(fecha, it.id);
      if(e?.state!=='ok' || e.rec==null) return;
      const oc = _ocNorm(it.oc);
      const grupo = porOC[oc] || (porOC[oc]={});
      const item = grupo[it.codigo] || (grupo[it.codigo]={nombre:it.nombre, um:it.um||'', cantidad:0});
      item.cantidad += e.rec;
    });
  });
  return porOC;
}
// ---- Helpers del reporte mensual ----
function _ocNorm(oc){ if(oc==null||oc==='') return 'SIN OC'; const t=String(oc).trim(); return /^\d+$/.test(t)? String(parseInt(t,10)) : t; }
// Lee TODAS las salidas confirmadas (SAL_STATE) hasta fechaFin, sin depender de
// que la dosificacion de ese dia siga cargada (antes de 31/08 ya no esta).
function _salidasConfirmadas(fechaIni, fechaFin){
  const porNombre = {};
  CATALOG.forEach(c=>{ if(!porNombre[c.nombre]) porNombre[c.nombre]=c; });
  const out = [];
  Object.keys(SAL_STATE).sort().forEach(fecha=>{
    if(fecha > fechaFin || (fechaIni && fecha < fechaIni)) return;
    Object.entries(SAL_STATE[fecha]?.items||{}).forEach(([key, entry])=>{
      if(entry?.rec==null) return;
      const partes = key.split('||').filter(x=>!/^#\d+$/.test(x));
      const [srv, prep, nb] = partes;
      const ocKey = partes.length>=5 ? partes[4] : null;
      const dos = (SAL_DOSIF[fecha]?.[srv]?.[prep]||[]).find(p=>p.n===nb);
      const cat = (dos && CATALOG.find(c=>c.id===dos.cod)) || porNombre[nb] || null;
      const cod = dos?.cod || cat?.id || ('?'+nb);
      out.push({fecha, cod, nombre: cat?.nombre || nb, um: dos?.m || cat?.unidad || '', oc: _ocNorm(ocKey ?? dos?.oc ?? cat?.oc), cantidad: entry.rec});
    });
  });
  return out;
}
function resumenSalidaPorOC(fechaIni, fechaFin){
  const porOC = {};
  _salidasConfirmadas(fechaIni, fechaFin).forEach(x=>{
    const grupo = porOC[x.oc] || (porOC[x.oc]={});
    const item = grupo[x.cod] || (grupo[x.cod]={nombre:x.nombre, um:x.um, cantidad:0});
    item.cantidad += x.cantidad;
  });
  return porOC;
}
// Inventario al cierre, por OC + producto: stock inicial + ingresos - salidas
// (+ devoluciones - adicionales) acumulado hasta fechaFin.
function inventarioPorOCAlCorte(fechaFin){
  const mapa = {};
  const get = (oc,cod,nombre,um)=>{ const k=oc+'||'+cod; return mapa[k] || (mapa[k]={oc,cod,nombre,um,saldo:0}); };
  const catOf = cod => CATALOG.find(c=>c.id===cod);
  Object.entries(STOCK_INICIAL).forEach(([cod,si])=>{
    if(si.fecha && si.fecha > fechaFin) return;
    const c=catOf(cod); get(_ocNorm(c?.oc), cod, c?.nombre||si.nombre, c?.unidad||si.um).saldo += si.stock||0;
  });
  Object.entries(INGRESO_DATA).forEach(([fecha, lista])=>{
    if(fecha > fechaFin) return;
    (lista||[]).forEach(it=>{
      const e = ingEntry(fecha, it.id);
      if(e?.state!=='ok' || e.rec==null) return;
      get(_ocNorm(it.oc), it.codigo, it.nombre, it.um).saldo += e.rec;
    });
  });
  _salidasConfirmadas(null, fechaFin).forEach(x=>{ get(x.oc, x.cod, x.nombre, x.um).saldo -= x.cantidad; });
  Object.entries(KARDEX).forEach(([cod, movs])=>{
    const c=catOf(cod);
    (movs||[]).forEach(m=>{
      if(m.fecha > fechaFin) return;
      const g=get(_ocNorm(c?.oc), cod, c?.nombre||cod, c?.unidad||'');
      if(m.tipo==='devolucion') g.saldo += m.cantidad;
      else if(m.tipo==='adicional') g.saldo -= m.cantidad;
    });
  });
  return Object.values(mapa);
}
function generarReporteMensualXLSX(mesStr){
  if(!mesStr){ toast('Elige un mes primero'); return; }
  const [anio, mes] = mesStr.split('-').map(Number);
  const fechaIni = mesStr+'-01';
  const ultimoDia = new Date(anio, mes, 0).getDate();
  const fechaFin = mesStr+'-'+String(ultimoDia).padStart(2,'0');
  const nombreMes = new Date(anio, mes-1, 1).toLocaleDateString('es-PE', {month:'long', year:'numeric'});

  // ---- Hoja Ingreso ----
  const ingPorOC = resumenIngresoPorOC(fechaIni, fechaFin);
  const filasIng = [['ORDEN DE COMPRA','CODIGO','PRODUCTO','UNIDAD','CANTIDAD INGRESADA EN EL MES']];
  Object.keys(ingPorOC).sort().forEach(oc=>{
    Object.entries(ingPorOC[oc]).sort((a,b)=>a[1].nombre.localeCompare(b[1].nombre)).forEach(([cod,it])=>{
      filasIng.push([oc, dispCod(cod), it.nombre, it.um, +it.cantidad.toFixed(3)]);
    });
  });

  // ---- Hoja Salida ----
  const salPorOC = resumenSalidaPorOC(fechaIni, fechaFin);
  const filasSal = [['ORDEN DE COMPRA','CODIGO','PRODUCTO','UNIDAD','CANTIDAD DISTRIBUIDA EN EL MES']];
  Object.keys(salPorOC).sort().forEach(oc=>{
    Object.entries(salPorOC[oc]).sort((a,b)=>a[1].nombre.localeCompare(b[1].nombre)).forEach(([cod,it])=>{
      filasSal.push([oc, dispCod(cod), it.nombre, it.um, +it.cantidad.toFixed(3)]);
    });
  });

  // ---- Hoja Inventario (al cierre del mes, solo con stock) ----
  const filasInv = [['ORDEN DE COMPRA','CODIGO','PRODUCTO','UNIDAD','STOCK AL CIERRE DE MES']];
  inventarioPorOCAlCorte(fechaFin).filter(x=>x.saldo>0.0001)
    .sort((a,b)=> a.oc.localeCompare(b.oc, undefined, {numeric:true}) || a.nombre.localeCompare(b.nombre))
    .forEach(x=> filasInv.push([x.oc, dispCod(x.cod), x.nombre, x.um, +x.saldo.toFixed(3)]));

  const wb = XLSX.utils.book_new();
  [['Ingreso',filasIng],['Salida',filasSal],['Inventario',filasInv]].forEach(([nombreHoja, filas])=>{
    const ws = XLSX.utils.aoa_to_sheet(filas);
    ws['!cols'] = [{wch:16},{wch:14},{wch:38},{wch:10},{wch:22}];
    XLSX.utils.book_append_sheet(wb, ws, nombreHoja);
  });
  XLSX.writeFile(wb, 'Reporte_mensual_'+mesStr+'.xlsx');
  toast('Reporte de '+nombreMes+' generado');
}

function renderSalida(){
  if(!SAL_DATE) SAL_DATE = new Date().toISOString().slice(0,10);
  const ps = salApsFor(SAL_DATE);
  let okN=0, pendN=0;
  ps.forEach(({s,p,pr,idx})=>{ if(salIst(SAL_DATE,s,p,pr,idx)==='ok') okN++; else pendN++; });
  let h = pageHead('Salida a produccion', 'Confirma el despacho de almacen a cocina segun la dosificacion del dia. Las cantidades ya estan establecidas. El stock mostrado junto a cada producto es el saldo actual calculado en el Kardex.',
    `<div class="ing-datebar">
      <button class="ing-arrow" onclick="salShiftDate(-1)">&#8592;</button>
      <input type="date" value="${SAL_DATE}" onchange="setSalDate(this.value)">
      <button class="ing-arrow" onclick="salShiftDate(1)">&#8594;</button>
      <span class="tbc">${ps.length} producto${ps.length!==1?'s':''}</span>
    </div>
    <div class="bar"><span class="fc fok fa">&#10003; OK: ${okN}</span><span class="fc">Pendientes: ${pendN}</span><button class="fc fa" onclick="salExportCSV()">&#8659; Exportar CSV del dia</button></div>`);
  if(!ps.length){
    h += `<div class="empty"><div class="ei2">&#128197;</div><div class="et">Sin dosificacion para este dia</div></div>`;
    document.getElementById('mainArea').innerHTML = h;
    return;
  }
  const saldos = calcularTodosLosSaldos();
  SRV_ORD.forEach(srv=>{
    const day = SAL_DOSIF[SAL_DATE]||{};
    if(!day[srv]) return;
    h += `<div class="sal-svc"><div class="sal-svc-hdr"><span>${srv}</span></div>`;
    Object.entries(day[srv]).forEach(([prep,prods])=>{
      h += `<div class="sal-prep"><div class="sal-prep-hdr">${ev(prep)}</div>`;
      const contados = {};
      prods.forEach(p=>{
        const dupKey = p.n+'||'+p.c+'||'+(p.oc!=null?p.oc:'');
        const idx = contados[dupKey] || 0;
        contados[dupKey] = idx+1;
        const st = salIst(SAL_DATE,srv,prep,p,idx);
        const entry = SAL_STATE[SAL_DATE]?.items?.[salK(srv,prep,p.n,p.c,p.oc,idx)] || SAL_STATE[SAL_DATE]?.items?.[salK(srv,prep,p.n,p.c,undefined,idx)] || SAL_STATE[SAL_DATE]?.items?.[salK(srv,prep,p.n,undefined,undefined,idx)] || SAL_STATE[SAL_DATE]?.items?.[salK(srv,prep,p.n,p.c,p.oc)] || SAL_STATE[SAL_DATE]?.items?.[salK(srv,prep,p.n,p.c)] || SAL_STATE[SAL_DATE]?.items?.[salK(srv,prep,p.n)];
        const rcls = st==='ok'?'rok':'';
        const stock = saldos[p.cod] || null;
        let stockTag = '';
        if(stock){
          if(st==='ok'){
            stockTag = `<span style="font-family:var(--mn);font-size:13px;font-weight:700;color:var(--mut)" title="${stock.tieneBase?'':'sin stock inicial registrado'}">Stock restante: ${stock.saldo.toFixed(3)} ${ev(p.m||'')}</span>`;
          } else {
            const suficiente = p.c!=null ? stock.saldo >= p.c - 0.001 : true;
            const color = suficiente ? 'var(--ok)' : 'var(--dg)';
            stockTag = `<span style="font-family:var(--mn);font-size:13px;font-weight:700;color:${color}" title="${stock.tieneBase?'':'sin stock inicial registrado'}">Stock: ${stock.saldo.toFixed(3)} ${ev(p.m||'')}${suficiente?'':' &#9888; no alcanza'}</span>`;
          }
        }
        h += `<div class="ing-row ${rcls}" style="border-radius:0;border-left:none;border-right:none;margin-bottom:0;border-top:none">
          <div class="ing-info"><div class="ing-name">${ev(p.n)}</div><div class="ing-meta">Dosificado: ${p.c??''} ${ev(p.m||'')}${st==='ok'?` &middot; Hora: ${entry.hora||''}`:''}</div>${stockTag?`<div style="margin-top:2px">${stockTag}</div>`:''}</div>
          ${st==='ok'
            ? `<span class="ing-badge ok">&#10003; OK</span><button class="undo" onclick="salDeshacer('${ev(SAL_DATE)}','${ev(srv)}','${ev(prep)}','${ev(p.n)}',${p.c??0},'${ev(p.oc||'')}',${idx})">deshacer</button>`
            : `<button class="fc fok" onclick="salConfirmarOK('${ev(SAL_DATE)}','${ev(srv)}','${ev(prep)}','${ev(p.n)}',${p.c??0},'${ev(p.oc||'')}',${idx})">&#10003; OK</button>`}
        </div>`;
      });
      h += `</div>`;
    });
    h += `</div>`;
  });
  document.getElementById('mainArea').innerHTML = h;
}
function salExportCSV(){
  const ps = salApsFor(SAL_DATE);
  const rows = [];
  ps.forEach(({s,p,pr,idx})=>{
    const it = SAL_STATE[SAL_DATE]?.items?.[salK(s,p,pr.n,pr.c,pr.oc,idx)] || SAL_STATE[SAL_DATE]?.items?.[salK(s,p,pr.n,pr.c,undefined,idx)] || SAL_STATE[SAL_DATE]?.items?.[salK(s,p,pr.n,undefined,undefined,idx)] || SAL_STATE[SAL_DATE]?.items?.[salK(s,p,pr.n,pr.c,pr.oc)] || SAL_STATE[SAL_DATE]?.items?.[salK(s,p,pr.n,pr.c)] || SAL_STATE[SAL_DATE]?.items?.[salK(s,p,pr.n)];
    if(it?.rec==null) return;
    rows.push([SAL_DATE,s,'"'+p+'"','"'+pr.n+'"',pr.m||'',it.rec,it.hora||'']);
  });
  if(!rows.length){ toast('Sin registros para exportar'); return; }
  const lines = [['Fecha','Servicio','Preparacion','Producto','UM','Cantidad','Hora'].join(',')];
  rows.forEach(r=>lines.push(r.join(',')));
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([lines.join('\n')],{type:'text/csv;charset=utf-8'}));
  a.download = 'salida_'+SAL_DATE+'.csv'; a.click(); URL.revokeObjectURL(a.href);
  toast('CSV exportado: '+rows.length+' productos');
}
function nextFechaConEntrega(dir){
  const fechas = fechasConEntrega();
  if(!fechas.length) return ING_DATE;
  if(!ING_DATE) return fechas[0];
  if(dir>0){ const f = fechas.find(f=>f>ING_DATE); return f || fechas[fechas.length-1]; }
  else{ const rev=[...fechas].reverse(); const f = rev.find(f=>f<ING_DATE); return f || fechas[0]; }
}

function ingEntry(fecha, entregaId){ return ING_STATE[fecha]?.items?.[entregaId] || null; }
function ingCompletarParcial(fecha, entregaId, uid){
  const v = parseFloat(document.getElementById('iq-'+uid)?.value);
  if(isNaN(v)||v<0){ toast('Ingresa una cantidad valida'); return; }
  const prev = ING_STATE[fecha]?.items?.[entregaId];
  if(!prev){ toast('No se encontro el registro original'); return; }
  const infoIt = (INGRESO_DATA[fecha]||[]).find(x=>x.id===entregaId);
  const entry = {entregaId, codigo: infoIt?infoIt.codigo:prev.codigo, oc: infoIt?infoIt.oc:prev.oc, rec: (prev.rec||0)+v, state:'ok', horaOK: new Date().toTimeString().slice(0,5), fechaReposicion: new Date().toISOString().slice(0,10), faltanteOriginal: prev.faltanteParcial || prev.faltanteOriginal, ts: Date.now()};
  ING_STATE[fecha].items[entregaId] = entry;
  saveIngresoLS();
  pushEvento('ingreso_set', {fecha, entregaId, entry});
  logActividad('Ingreso completado: '+(infoIt?infoIt.nombre:entregaId)+' — se agrego '+v+' (total: '+entry.rec+')');
  renderFaltantes();
  toast('Ingreso completado');
}
function ingConfirmarOK(fecha, entregaId, uid){
  const v = parseFloat(document.getElementById('iq-'+uid)?.value);
  if(isNaN(v)||v<0){ toast('Ingresa una cantidad valida'); return; }
  if(!ING_STATE[fecha]) ING_STATE[fecha]={items:{}};
  const prev = ING_STATE[fecha].items[entregaId];
  const hora = new Date().toTimeString().slice(0,5);
  const infoIt = (INGRESO_DATA[fecha]||[]).find(x=>x.id===entregaId);
  const esperado = infoIt ? infoIt.cantidad : null;
  const entry = {entregaId, codigo: infoIt?infoIt.codigo:prev?.codigo, oc: infoIt?infoIt.oc:prev?.oc, rec: v, state:'ok', horaOK: hora, ts: Date.now()};
  if(esperado!=null && v < esperado - 0.001){
    entry.faltanteParcial = +(esperado - v).toFixed(3);
  }
  if(prev && prev.state==='pendiente'){
    entry.fechaReposicion = new Date().toISOString().slice(0,10);
    entry.obs = prev.obs || '';
  } else if(prev && prev.faltanteParcial && !entry.faltanteParcial){
    entry.fechaReposicion = new Date().toISOString().slice(0,10);
    entry.faltanteOriginal = prev.faltanteParcial;
  }
  ING_STATE[fecha].items[entregaId] = entry;
  saveIngresoLS();
  pushEvento('ingreso_set', {fecha, entregaId, entry});
  logActividad('Ingreso confirmado: '+(infoIt?infoIt.nombre:entregaId)+' — '+v+(entry.faltanteParcial?(' (faltante parcial: '+entry.faltanteParcial+')'):'')+(entry.fechaReposicion?' (reposicion de faltante)':''));
  renderIngreso();
  toast(entry.faltanteParcial ? ('Ingreso parcial — faltan '+entry.faltanteParcial) : ('Ingreso confirmado ('+hora+')'));
}
function ingMarcarPendiente(fecha, entregaId){
  const obs = prompt('Observacion (opcional): motivo por el que no ingreso (rechazado, no lo trajo el proveedor, etc.)') || '';
  if(!ING_STATE[fecha]) ING_STATE[fecha]={items:{}};
  const infoIt = (INGRESO_DATA[fecha]||[]).find(x=>x.id===entregaId);
  const entry = {entregaId, codigo: infoIt?infoIt.codigo:null, oc: infoIt?infoIt.oc:null, rec:null, state:'pendiente', obs, ts: Date.now()};
  ING_STATE[fecha].items[entregaId] = entry;
  saveIngresoLS();
  pushEvento('ingreso_set', {fecha, entregaId, entry});
  logActividad('Ingreso pendiente/faltante: '+(infoIt?infoIt.nombre:entregaId));
  renderIngreso();
  toast('Marcado como pendiente / faltante');
}
function ingDeshacer(fecha, entregaId){
  if(ING_STATE[fecha]?.items?.[entregaId]) delete ING_STATE[fecha].items[entregaId];
  saveIngresoLS();
  pushEvento('ingreso_undo', {fecha, entregaId, ts: Date.now()});
  // Cascada: si este ingreso ya tenia preparaciones distribuidas a partir
  // de el, se deshacen tambien esas salidas y se limpia su registro de
  // Distribucion -- si el ingreso se deshace (nunca llego / fue un error),
  // lo que se distribuyo con base en el tampoco deberia quedar confirmado.
  const asignados = distribAsignados(fecha, entregaId);
  if(asignados.length){
    asignados.forEach(a=>{ salDeshacer(a.fecha, a.turno, a.prep, a.nombre, a.cantidad, a.oc, a.idx); });
    guardarAsignados(fecha, entregaId, []);
  }
  const infoIt = (INGRESO_DATA[fecha]||[]).find(x=>x.id===entregaId);
  logActividad('Ingreso deshecho: '+(infoIt?infoIt.nombre:entregaId)+(asignados.length?(' (y '+asignados.length+' salida(s) asociada(s) deshecha(s))'):''));
  renderIngreso();
  toast('Confirmacion deshecha'+(asignados.length?' junto con sus salidas':''));
}
function todosLosFaltantes(){
  const out = [];
  Object.entries(ING_STATE).forEach(([fecha, day])=>{
    Object.entries(day.items||{}).forEach(([key, entry])=>{
      if(entry.state==='pendiente' || entry.fechaReposicion || entry.faltanteParcial){
        const entregaId = entry.entregaId || key;
        const info = (INGRESO_DATA[fecha]||[]).find(x=>x.id===entregaId) ||
                     (INGRESO_DATA[fecha]||[]).find(x=>x.codigo===(entry.codigo||key.split('||')[0]));
        out.push({fecha, entregaId, codigo: entry.codigo||(info?info.codigo:key), oc: entry.oc, entry,
                   nombre: info?info.nombre:(entry.codigo||key), proveedor: info?info.proveedor:'', esperado: info?info.cantidad:null, um: info?info.um:''});
      }
    });
  });
  out.sort((a,b)=> b.fecha.localeCompare(a.fecha));
  return out;
}
function ordenarPorOCyNombre(items){
  return items.slice().sort((a,b)=>{
    const ocA = parseInt((a.oc||'').match(/\d+/)?.[0] || '999999', 10);
    const ocB = parseInt((b.oc||'').match(/\d+/)?.[0] || '999999', 10);
    if(ocA !== ocB) return ocA - ocB;
    return (a.nombre||'').localeCompare(b.nombre||'', 'es');
  });
}

// Reemplaza el sistema anterior (Google Apps Script + Google Sheets). Con
// Firebase, los eventos llegan en tiempo real de verdad (el servidor avisa
// al instante cuando hay algo nuevo) en vez de tener que preguntar cada
// cierto tiempo, y no hay limite de cuantas filas se pueden leer de golpe
// -- por eso ya no hace falta cursor, tandas, ni una cola de reintentos
// propia (Firebase reintenta solo si se pierde la conexion).

// Inicio de sesion anonimo: no le pide nada a la persona (no hay

// URL de la base de datos pueda leer o escribir sin pasar por Firebase.
async function autenticarFirebase(){

    return true;
  }catch(e){

    FB_AUTH_READY = false;
    return false;
  }
}

function saveLastEventIds(){
  // Conserva solo los ultimos 8000 ids para que este archivo no crezca sin limite.
  const arr = Array.from(LAST_EVENT_IDS);
  const trimmed = arr.length>8000 ? arr.slice(arr.length-8000) : arr;
  safeLocalSet('lastEventIds_APP2', JSON.stringify(trimmed));
}

// Copia (una vez, o las veces que haga falta: es idempotente porque conserva la
// misma clave de cada evento) todo el historial de la App 1 ('eventos') hacia
// el registro de esta App 2 ('eventos_v2'). Despues este dispositivo lo recibe solo.
async function copiarHistorialApp1(){
  if(!FB_DB){ toast('Firebase no esta configurado'); return; }
  if(!confirm('Esto copia TODO el historial de la App 1 (ingresos, salidas, devoluciones, adicionales) a esta App 2. No modifica ni borra nada de la App 1. ¿Continuar?')) return;
  const box = document.getElementById('copiaBox');
  const say = (t,c)=>{ if(box) box.innerHTML = '<div class="ing-meta" style="color:'+(c||'inherit')+'">'+t+'</div>'; };
  say('Leyendo historial de la App 1...');
  try{
    if(!FB_AUTH_READY) await autenticarFirebase();
    const snap = await FB_DB.ref('eventos').once('value');
    const all = {}; let n = 0;
    snap.forEach(ch=>{ all[ch.key] = ch.val(); n++; });
    const keys = Object.keys(all);
    for(let i=0;i<keys.length;i+=300){
      const upd = {};
      keys.slice(i,i+300).forEach(k=>{ upd[k] = all[k]; });
      await FB_DB.ref(EVT_PATH).update(upd);
      say('Copiando... '+Math.min(i+300,keys.length)+' de '+keys.length);
    }
    say('<b>Listo:</b> '+n+' evento(s) copiados. Pulsa "Resincronizar todo" para verlos en este dispositivo.','var(--ok)');
    toast('Historial de la App 1 copiado');
  }catch(e){
    console.error(e);
    say('Error: '+(e&&e.message||e)+'. Si dice "permission denied", hay que permitir la ruta eventos_v2 en las reglas de Firebase.','var(--dg)');
  }
}

// Envia un evento a Firebase. No hace falta esperar la respuesta (Firebase
// guarda la escritura localmente y la reintenta solo si estaba offline).
function pushEvento(tipo, payload){
  if(!FB_DB) return;
  const id = Date.now()+'_'+Math.random().toString(36).slice(2);
  LAST_EVENT_IDS.add(id);
  saveLastEventIds();
  FB_DB.ref(EVT_PATH).push({id, tipo, payload: JSON.stringify(payload), ts: Date.now()})
    .catch(e=>console.error('sync push error', e));
}
// Carga inicial (todo el historial de una sola vez) + escucha en tiempo
// real para lo que llegue despues. Se llama una vez desde init().
async function iniciarSincronizacionFirebase(){
  if(!FB_DB) return;
  const ok = await autenticarFirebase();
  if(!ok){ if(TAB==='sync') renderSync(); return; }
  const ref = FB_DB.ref(EVT_PATH);
  ref.once('value').then(snapshot=>{
    const DIRTY = {salida:false, ingreso:false, kardex:false, distrib:false};
    let nuevos = 0;
    snapshot.forEach(child=>{
      const evt = child.val();
      if(!evt || LAST_EVENT_IDS.has(evt.id)) return;
      try{
        aplicarEventoRemoto(evt.tipo, JSON.parse(evt.payload), DIRTY);
        LAST_EVENT_IDS.add(evt.id);
        nuevos++;
      }catch(e){ console.error('Error aplicando evento inicial', evt.id, evt.tipo, e); }
    });
    if(DIRTY.salida) saveSalidaLS();
    if(DIRTY.ingreso) saveIngresoLS();
    if(DIRTY.kardex) saveKardexLS();
    if(DIRTY.distrib) saveDistribLS();
    if(nuevos>0) saveLastEventIds();
    LAST_SYNC_TIME = new Date();
    if(nuevos>0) render(); else if(TAB==='sync') renderSync();

    // De aqui en adelante, cualquier evento nuevo (de cualquier
    // dispositivo, incluido este) llega al instante, sin tener que
    // preguntar cada cierto tiempo.
    // Los eventos que llegan en tiempo real se agrupan en pequeños lotes
    // (en vez de procesar/guardar/redibujar uno por uno). Esto es clave
    // cuando otro dispositivo publica de golpe cientos o miles de eventos
    // (por ejemplo al "Publicar mi historial local") -- sin agrupar,
    // redibujar la pantalla entera por cada uno de miles de eventos
    // congela el navegador.
    let pendientesTiempoReal = [];
    let temporizadorLote = null;
    let primerPendienteEn = 0;
    function procesarLotePendiente(){
      const lote = pendientesTiempoReal;
      pendientesTiempoReal = [];
      primerPendienteEn = 0;
      const DIRTY2 = {salida:false, ingreso:false, kardex:false, distrib:false};
      let aplicados = 0;
      lote.forEach(evt=>{
        if(LAST_EVENT_IDS.has(evt.id)) return;
        try{
          aplicarEventoRemoto(evt.tipo, JSON.parse(evt.payload), DIRTY2);
          LAST_EVENT_IDS.add(evt.id);
          aplicados++;
        }catch(e){ console.error('Error aplicando evento en tiempo real', evt.id, evt.tipo, e); }
      });
      if(aplicados>0){
        saveLastEventIds();
        if(DIRTY2.salida) saveSalidaLS();
        if(DIRTY2.ingreso) saveIngresoLS();
        if(DIRTY2.kardex) saveKardexLS();
        if(DIRTY2.distrib) saveDistribLS();
        LAST_SYNC_TIME = new Date();
        render();
      }
    }
    ref.on('child_added', child=>{
      const evt = child.val();
      if(!evt || LAST_EVENT_IDS.has(evt.id)) return;
      pendientesTiempoReal.push(evt);
      const ahora = Date.now();
      if(!primerPendienteEn) primerPendienteEn = ahora;
      if(temporizadorLote) clearTimeout(temporizadorLote);
      // Si llevan mas de 1.5s esperando (llegada continua de eventos),
      // se fuerza a procesar YA, para no quedarse esperando para siempre.
      const espera = (ahora - primerPendienteEn) > 1500 ? 0 : 200;
      temporizadorLote = setTimeout(procesarLotePendiente, espera);
    });
  }).catch(e=>{
    console.error('Error cargando historial inicial de Firebase', e);
    if(TAB==='sync') renderSync();
  });
  FB_DB.ref('.info/connected').on('value', snap=>{
    FB_CONNECTED = !!snap.val();
    if(TAB==='sync') renderSync();
  });
}
// Importa (UNA SOLA VEZ) el historial que estaba guardado en la hoja de
// Google Sheets del sistema anterior, para no perder lo ya confirmado.
// Es seguro correrlo mas de una vez (Firebase no rechaza duplicados por
// id, pero como cada evento se identifica por su propio id, aplicarlo dos
// veces no causa problema -- LAST_EVENT_IDS lo ignora la segunda vez).
async function importarDesdeGoogleSheets(urlAntigua){
  const box = document.getElementById('migBox');
  if(!urlAntigua){ if(box) box.innerHTML = '<div class="ing-meta" style="color:var(--dg)">Pega la URL antigua primero.</div>'; return; }
  if(!FB_DB){ if(box) box.innerHTML = '<div class="ing-meta" style="color:var(--dg)">Firebase no esta configurado.</div>'; return; }
  if(!confirm('Esto copia TODO el historial de la hoja de Google hacia Firebase. Puede tardar unos minutos. ¿Continuar?')) return;
  if(box) box.innerHTML = '<div class="ing-meta">Importando, no cierres esta pantalla...</div>';
  try{
    let desde = 0, total = null, importados = 0;
    do{
      const r = await fetch(urlAntigua+'?t='+Date.now()+'&desde='+desde);
      const data = await r.json();
      if(!data.ok || !data.eventos.length) break;
      const updates = {};
      data.eventos.forEach(evt=>{
        const key = FB_DB.ref(EVT_PATH).push().key;
        updates[key] = {id: evt.id, tipo: evt.tipo, payload: evt.payload, ts: Date.now()};
      });
      await FB_DB.ref(EVT_PATH).update(updates);
      importados += data.eventos.length;
      desde += data.eventos.length;
      total = data.total;
      if(box) box.innerHTML = `<div class="ing-meta">Importados ${importados} de ${total}...</div>`;
      await new Promise(res=>setTimeout(res,300));
    } while(total!=null && desde<total);
    if(box) box.innerHTML = `<div class="ing-meta" style="color:var(--ok)"><b>Importacion completa.</b> ${importados} evento(s) copiados a Firebase.</div>`;
    toast('Importacion completa: '+importados+' evento(s)');
  }catch(e){
    if(box) box.innerHTML = `<div class="ing-meta" style="color:var(--dg)">Error durante la importacion: ${ev(e.message)}</div>`;
  }
}
// Parser CSV robusto (soporta comas y saltos de linea DENTRO de un campo
// entre comillas, como pasa con la columna "payload" que trae JSON).
function parseCSV(texto){
  const filas = [];
  let fila = [];
  let campo = '';
  let dentroComillas = false;
  for(let i=0; i<texto.length; i++){
    const c = texto[i];
    if(dentroComillas){
      if(c === '"'){
        if(texto[i+1] === '"'){ campo += '"'; i++; }
        else { dentroComillas = false; }
      } else { campo += c; }
    } else {
      if(c === '"'){ dentroComillas = true; }
      else if(c === ','){ fila.push(campo); campo = ''; }
      else if(c === '\n'){ fila.push(campo); filas.push(fila); fila = []; campo = ''; }
      else if(c === '\r'){ /* se ignora, el \n que sigue cierra la fila */ }
      else { campo += c; }
    }
  }
  if(campo.length || fila.length){ fila.push(campo); filas.push(fila); }
  return filas;
}

    if(box) box.innerHTML = `<div class="ing-meta" style="color:var(--ok)"><b>Importacion completa.</b> ${importados} evento(s) copiados a Firebase.</div>`;

// Reconstruye eventos a partir de lo que YA esta guardado localmente en
// este dispositivo (Ingreso, Salida, Kardex, Distribucion) y los publica
// en Firebase. Sirve para dispositivos que tenian confirmaciones que
// nunca llegaron a guardarse en la hoja de Google (por problemas de
// conexion) -- asi no se pierden al pasar a Firebase. Es seguro repetirlo
// en varios dispositivos: cada evento respeta su propia fecha/hora
// original, asi que si dos dispositivos publican lo mismo, no se pisan
// entre si ni duplican el resultado final (solo queda la version mas
// reciente de cada cosa).
async function republicarHistorialLocal(){
  const box = document.getElementById('migBox');
  if(!FB_DB){ if(box) box.innerHTML = '<div class="ing-meta" style="color:var(--dg)">Firebase no esta configurado.</div>'; return; }
  if(!confirm('Esto publica en Firebase TODO lo que ya esta confirmado en ESTE dispositivo (Ingreso, Salida, Kardex, Distribucion), por si algo no llego a sincronizarse antes. No borra ni cambia nada local. ¿Continuar?')) return;
  if(box) box.innerHTML = '<div class="ing-meta">Recolectando...</div>';
  try{
    const eventos = [];
    // Ingreso
    Object.entries(ING_STATE).forEach(([fecha, day])=>{
      Object.entries(day.items||{}).forEach(([entregaId, entry])=>{
        eventos.push({tipo:'ingreso_set', payload:{fecha, entregaId, entry}});
      });
    });
    // Salida
    Object.keys(SAL_DOSIF).forEach(fecha=>{
      salApsFor(fecha).forEach(({s,p,pr,idx})=>{
        if(salIst(fecha,s,p,pr,idx)!=='ok') return;
        const entry = SAL_STATE[fecha]?.items?.[salK(s,p,pr.n,pr.c,pr.oc,idx)]
          || SAL_STATE[fecha]?.items?.[salK(s,p,pr.n,pr.c,undefined,idx)]
          || SAL_STATE[fecha]?.items?.[salK(s,p,pr.n,undefined,undefined,idx)]
          || SAL_STATE[fecha]?.items?.[salK(s,p,pr.n,pr.c,pr.oc)]
          || SAL_STATE[fecha]?.items?.[salK(s,p,pr.n,pr.c)]
          || SAL_STATE[fecha]?.items?.[salK(s,p,pr.n)];
        if(!entry) return;
        eventos.push({tipo:'salida_ok', payload:{fecha, s, p, nb:pr.n, cantidad:pr.c, oc:pr.oc, idx, hora:entry.hora, ts:entry.ts||Date.now()}});
      });
    });
    // Kardex (devoluciones y pedidos adicionales)
    Object.entries(KARDEX).forEach(([codigo, movs])=>{
      (movs||[]).forEach(mov=>{ eventos.push({tipo:'movimiento', payload:{codigo, mov}}); });
    });
    // Distribucion
    Object.entries(DISTRIB_STATE).forEach(([key, valor])=>{
      if(key==='_ts') return;
      eventos.push({tipo:'distrib_set', payload:{key, valor, ts: DISTRIB_STATE._ts?.[key]||Date.now()}});
    });

    let publicados = 0;
    for(let i=0; i<eventos.length; i+=500){
      const lote = eventos.slice(i, i+500);
      const updates = {};
      lote.forEach(e=>{
        const id = 'republicado_'+Date.now()+'_'+Math.random().toString(36).slice(2);
        const key = FB_DB.ref(EVT_PATH).push().key;
        updates[key] = {id, tipo:e.tipo, payload: JSON.stringify(e.payload), ts: Date.now()};
        // Se marca como ya visto en ESTE dispositivo -- es su propio
        // historial, ya lo tiene aplicado; no hace falta que se lo vuelva
        // a re-procesar a si mismo cuando le llegue de vuelta por Firebase.
        LAST_EVENT_IDS.add(id);
      });
      await FB_DB.ref(EVT_PATH).update(updates);
      publicados += lote.length;
      if(box) box.innerHTML = `<div class="ing-meta">Publicados ${publicados} de ${eventos.length}...</div>`;
      await new Promise(res=>setTimeout(res,150));
    }
    saveLastEventIds();
    if(box) box.innerHTML = `<div class="ing-meta" style="color:var(--ok)"><b>Listo.</b> ${publicados} confirmacion(es) de este dispositivo publicadas en Firebase.</div>`;
    toast('Historial local publicado: '+publicados);
  }catch(e){
    if(box) box.innerHTML = `<div class="ing-meta" style="color:var(--dg)">Error: ${ev(e.message)}</div>`;
  }
}
// Limpieza de duplicados en Firebase: a diferencia de la hoja de Google
// (donde el duplicado era por reintentos de red), aqui puede pasar por
// publicar el historial local mas de una vez -- cada intento genera un id
// nuevo, asi que no se detectan por id sino por CONTENIDO identico
// (mismo tipo + mismo payload). Se queda solo con el mas antiguo de cada
// grupo repetido.
async function limpiarDuplicadosFirebase(){
  const box = document.getElementById('migBox');
  if(!FB_DB){ if(box) box.innerHTML = '<div class="ing-meta" style="color:var(--dg)">Firebase no esta configurado.</div>'; return; }
  if(!confirm('Esto revisa todo el historial de Firebase y borra las copias repetidas (mismo contenido exacto), dejando solo una de cada una. No afecta el saldo ni los datos, solo aligera la base. ¿Continuar?')) return;
  if(box) box.innerHTML = '<div class="ing-meta">Revisando historial completo...</div>';
  try{
    const snapshot = await FB_DB.ref(EVT_PATH).once('value');
    const vistos = new Map(); // contenido -> {key, ts} del primero que se vio
    const aBorrar = [];
    let total = 0;
    snapshot.forEach(child=>{
      total++;
      const evt = child.val();
      const contenido = evt.tipo+'|'+evt.payload;
      const existente = vistos.get(contenido);
      if(existente){
        // Se borra el que tenga el id mas nuevo (Date.now() al inicio del
        // id es mayor = mas reciente), conservando el mas antiguo.
        if(evt.id > existente.id){ aBorrar.push(child.key); }
        else { aBorrar.push(existente.key); vistos.set(contenido, {key: child.key, id: evt.id}); }
      } else {
        vistos.set(contenido, {key: child.key, id: evt.id});
      }
    });
    if(!aBorrar.length){
      if(box) box.innerHTML = `<div class="ing-meta" style="color:var(--ok)">No se encontraron duplicados. ${total} evento(s) revisado(s), todos unicos.</div>`;
      return;
    }
    let borrados = 0;
    for(let i=0; i<aBorrar.length; i+=500){
      const lote = aBorrar.slice(i, i+500);
      const updates = {};
      lote.forEach(key=>{ updates[key] = null; });
      await FB_DB.ref(EVT_PATH).update(updates);
      borrados += lote.length;
      if(box) box.innerHTML = `<div class="ing-meta">Borrados ${borrados} de ${aBorrar.length} duplicados...</div>`;
      await new Promise(res=>setTimeout(res,150));
    }
    if(box) box.innerHTML = `<div class="ing-meta" style="color:var(--ok)"><b>Listo.</b> ${borrados} evento(s) duplicado(s) eliminados de ${total} revisados. Quedaron ${total-borrados}.</div>`;
    toast('Duplicados eliminados: '+borrados);
  }catch(e){
    if(box) box.innerHTML = `<div class="ing-meta" style="color:var(--dg)">Error: ${ev(e.message)}</div>`;
  }
}
function aplicarEventoRemoto(tipo, p, DIRTY){
  // Los eventos pueden llegar/reproducirse fuera de orden (por ejemplo al
  // usar "Resincronizar todo"). Cada confirmacion/deshacer trae su propia
  // marca de hora (ts); solo se aplica si es igual o mas nueva que lo que
  // ya hay guardado, para que un evento antiguo nunca pise uno reciente.
  if(tipo==='salida_ok'){
    if(!SAL_STATE[p.fecha]) SAL_STATE[p.fecha] = {items:{}};
    const key = salK(p.s,p.p,p.nb,p.cantidad,p.oc,p.idx);
    const actual = SAL_STATE[p.fecha].items[key];
    if(!actual || (actual.ts||0) <= (p.ts||0)){
      SAL_STATE[p.fecha].items[key] = {rec:p.cantidad, hora:p.hora, ts:p.ts};
      DIRTY.salida = true;
      logActividad('Salida confirmada: '+p.nb+' ('+p.p+') — '+p.cantidad);
    }
  } else if(tipo==='salida_undo'){
    const key = salK(p.s,p.p,p.nb,p.cantidad,p.oc,p.idx);
    const actual = SAL_STATE[p.fecha]?.items?.[key];
    if(!actual || (actual.ts||0) <= (p.ts||0)){
      if(SAL_STATE[p.fecha]?.items){
        delete SAL_STATE[p.fecha].items[key];
        delete SAL_STATE[p.fecha].items[salK(p.s,p.p,p.nb,p.cantidad,undefined,p.idx)];
        delete SAL_STATE[p.fecha].items[salK(p.s,p.p,p.nb,undefined,undefined,p.idx)];
      }
      DIRTY.salida = true;
      logActividad('Salida deshecha: '+p.nb);
    }
  } else if(tipo==='ingreso_set'){
    if(!ING_STATE[p.fecha]) ING_STATE[p.fecha] = {items:{}};
    const actual = ING_STATE[p.fecha].items[p.entregaId];
    if(!actual || (actual.ts||0) <= (p.entry.ts||0)){
      ING_STATE[p.fecha].items[p.entregaId] = p.entry;
      DIRTY.ingreso = true;
      const infoIt = (INGRESO_DATA[p.fecha]||[]).find(x=>x.id===p.entregaId);
      const nom = infoIt?infoIt.nombre:p.entregaId;
      logActividad(p.entry.state==='ok' ? ('Ingreso confirmado: '+nom+' — '+p.entry.rec+(p.entry.fechaReposicion?' (reposicion de faltante)':'')) : ('Ingreso pendiente/faltante: '+nom));
    }
  } else if(tipo==='ingreso_undo'){
    const actual = ING_STATE[p.fecha]?.items?.[p.entregaId];
    if(!actual || (actual.ts||0) <= (p.ts||0)){
      if(ING_STATE[p.fecha]?.items) delete ING_STATE[p.fecha].items[p.entregaId];
      DIRTY.ingreso = true;
      const infoIt = (INGRESO_DATA[p.fecha]||[]).find(x=>x.id===p.entregaId);
      logActividad('Ingreso deshecho: '+(infoIt?infoIt.nombre:p.entregaId));
    }
  } else if(tipo==='movimiento'){
    const arr = KARDEX[p.codigo] || (KARDEX[p.codigo] = []);
    if(!arr.some(m=>m._syncId===p.mov._syncId)){
      arr.unshift(p.mov);
      const it = CATALOG.find(i=>i.id===p.codigo);
      logActividad((p.mov.tipo==='devolucion'?'Devolucion registrada: ':'Pedido adicional: ')+(it?it.nombre:p.codigo)+' — '+p.mov.cantidad);
    }
    DIRTY.kardex = true;
  } else if(tipo==='movimiento_borrado'){
    const arr = KARDEX[p.codigo] || [];
    const idx = arr.findIndex(m=>m._syncId===p.syncId);
    if(idx!==-1){
      const mov = arr[idx];
      arr.splice(idx,1);
      const it = CATALOG.find(i=>i.id===p.codigo);
      logActividad('Movimiento eliminado: '+(mov.tipo==='devolucion'?'Devolucion':'Pedido adicional')+' de '+(it?it.nombre:p.codigo)+' — '+mov.cantidad);
    }
    DIRTY.kardex = true;
  } else if(tipo==='salida_borrar_clave'){
    if(SAL_STATE[p.fecha]?.items && Object.prototype.hasOwnProperty.call(SAL_STATE[p.fecha].items, p.key)){
      delete SAL_STATE[p.fecha].items[p.key];
      DIRTY.salida = true;
      logActividad('Salida huerfana eliminada: '+(p.key.split('||')[2]||p.key)+' ('+p.fecha+')');
    }
  } else if(tipo==='distrib_set'){
    const actual = DISTRIB_STATE[p.key];
    // El registro de una entrega se reemplaza entero cada vez (lista completa
    // de asignaciones); se compara por ts para que un evento viejo repetido
    // no pise una version mas nueva.
    if(!DISTRIB_STATE._ts) DISTRIB_STATE._ts = {};
    if(!DISTRIB_STATE._ts[p.key] || DISTRIB_STATE._ts[p.key] <= (p.ts||0)){
      DISTRIB_STATE[p.key] = p.valor;
      DISTRIB_STATE._ts[p.key] = p.ts||0;
      DIRTY.distrib = true;
    }
  }
}
// Con Firebase, la sincronizacion en tiempo real ya esta activa todo el
// tiempo (ver iniciarSincronizacionFirebase) -- este boton es solo para
// dar tranquilidad visual / forzar una revisión puntual sin limpiar nada.
function sincronizarAhora(){
  if(!FB_DB){ toast('Firebase no esta configurado'); return; }
  toast('Revisando...');
  FB_DB.ref(EVT_PATH).once('value').then(snapshot=>{
    const DIRTY = {salida:false, ingreso:false, kardex:false, distrib:false};
    let nuevos = 0;
    snapshot.forEach(child=>{
      const evt = child.val();
      if(!evt || LAST_EVENT_IDS.has(evt.id)) return;
      try{ aplicarEventoRemoto(evt.tipo, JSON.parse(evt.payload), DIRTY); LAST_EVENT_IDS.add(evt.id); nuevos++; }
      catch(e){ console.error(e); }
    });
    if(DIRTY.salida) saveSalidaLS();
    if(DIRTY.ingreso) saveIngresoLS();
    if(DIRTY.kardex) saveKardexLS();
    if(DIRTY.distrib) saveDistribLS();
    if(nuevos>0) saveLastEventIds();
    LAST_SYNC_TIME = new Date();
    if(nuevos>0) render(); else renderSync();
    toast(nuevos>0 ? ('Sincronizado: '+nuevos+' evento(s) nuevo(s)') : 'Ya estaba al dia');
  }).catch(e=>{ console.error(e); toast('Error de sincronizacion'); });
}
